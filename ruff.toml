#
# Python linting and formatting (PLAN Section 8.7: ruff lint + format), for the harness scripts
# (ci/, parity/) and the Python packages. Run through pre-commit.
line-length = 100
target-version = "py312"
# Generated by nanobind.stubgen (scripts/regen.py --stubs checks it byte for byte).
extend-exclude = ["python/dyng/_core.pyi"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]

[format]
quote-style = "double"
