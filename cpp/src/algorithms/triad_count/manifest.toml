computes    = "hypergraph h-motif triad counts"
paper       = "-"
since       = "0.3"
family      = "aggregate_delta"
container   = "hypergraph"
tier        = "framework"
maturity    = "experimental"
backends    = ["sequential", "openmp"]
determinism = "exact_value"
oracle      = "compute"
graph_requirements = { line_graph = "any", store_v2h = "any", reuse = "any", storage = "any" }
cite        = []
maintainers = ["SMShovan"]
