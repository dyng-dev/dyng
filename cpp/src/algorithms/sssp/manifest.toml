#
# The sssp manifest (PLAN Section 4.8). scripts/regen.py reads it (the algorithm tables, the
# CODEOWNERS block and the registries; `python3 scripts/regen.py` after an edit); CMake does not.
name        = "sssp"
title       = "Dynamic single-source shortest paths"
computes    = "dynamic single-source shortest paths"   # the "Computes" column of the algorithm tables
paper       = "DynaMOSP (IPDPS 2025, TPDS 2025)"
since       = "0.1"                     # the first release that contains it
family      = "fixed_point"
container   = "graph"
tier        = "custom_engine"
maturity    = "stable"                  # since 0.1.0 (decided 2026-09-30, GOVERNANCE.md)
backends    = ["sequential", "openmp", "cuda"]
determinism = "bitwise"
oracle      = "compute"
graph_requirements = { multi_edges = "any", row_order = "any", store_transposed = true }
cite        = ["dynamosp2025", "dynamosptpds2025"]
maintainers = ["SMShovan"]
origin      = [ { repo = "MOSP-OpenMP", commit = "c352151", paths = ["src/sospUpdateCpu.cpp", "src/sequentialSOSPUpdate.cpp", "headers/listGather.h"] },
                { repo = "MOSP-CUDA", commit = "e220ee2", paths = ["src/sospUpdateGpu.cu", "headers/sospUpdateGpu.cuh", "src/deviceGraph.cu"] } ]

[performance]
compute_tolerance    = 1.05
end_to_end_tolerance = 1.10
