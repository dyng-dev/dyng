#
# The hyper_sssp manifest (PLAN Section 4.8) of a hypergraph algorithm. scripts/regen.py
# reads it (the algorithm tables, the CODEOWNERS block and the registries; `python3
# scripts/regen.py` after an edit); CMake does not. For a hypergraph algorithm,
# `graph_requirements` names what it needs of the hypergraph (ADR 0043): line_graph ("required",
# "any"), store_v2h ("required", "any"), reuse ("any", "erase_first", "insert_first") and storage
# ("any", "escher", "slack_csr").
# scaffolded by scripts/new_algorithm.py: `--remove` deletes the algorithm only while this line is here
name        = "hyper_sssp"
title       = "Dynamic single-source shortest hyperpaths"
computes    = "shortest hyperpaths"
paper       = "H-SOSP (IA3 2026)"
since       = "0.4"
family      = "fixed_point"
container   = "hypergraph"
tier        = "custom_engine"
maturity    = "experimental"            # tracked by the API snapshot, frozen at the end of M11b (HD17)
backends    = ["sequential", "cuda"]     # no openmp backend in 0.4 (HD14, joint with AD19)
determinism = "bitwise"
oracle      = "compute"
# Weighted hyperedges (int32_t weights in [1, 2^28], checked by compute() and before the commit) on
# slack_csr storage with its line graph (line_graph_policy::slack_csr, or automatic -> slack_csr)
# and the vertex-to-hyperedge rows; any id_reuse order (parity runs set insert_first, O16).
graph_requirements = { line_graph = "required", store_v2h = "required", reuse = "any", storage = "slack_csr" }
cite        = ["hsosp2026"]
maintainers = ["SMShovan"]
python      = false   # true once python/dyng/<name>.py and its bindings exist (PLAN 4.8, file 17; M11b)
origin      = [ { repo = "MOSP_ESCHER", commit = "4b86159", paths = ["hsosp/include/hsosp.cuh", "hsosp/src/hsospDevice.cu", "hypergraph/src/HostHypergraph.cpp", "hypergraph/src/HypergraphOracle.cpp"] } ]

[performance]
compute_tolerance    = 1.05
end_to_end_tolerance = 1.10
