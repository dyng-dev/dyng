#
# The algorithm_template manifest (PLAN Section 4.8). scripts/regen.py reads it (the algorithm
# tables, the CODEOWNERS block and the registries; `python3 scripts/regen.py` after an edit); CMake
# does not.
name        = "algorithm_template"
title       = "{{title}}"
computes    = "{{computes}}"
paper       = "-"
since       = "{{since}}"
family      = "{{family}}"
container   = "graph"
tier        = "framework"
maturity    = "experimental"
backends    = [{{backends}}]
determinism = "exact_value"
oracle      = "compute"
#@@ fixed_point
graph_requirements = { multi_edges = "any", row_order = "any" }
#@@ end
#@@ aggregate_delta
graph_requirements = { multi_edges = "forbid", row_order = "sorted" }   # checked in compute()
#@@ end
cite        = []
maintainers = ["{{maintainer}}"]
