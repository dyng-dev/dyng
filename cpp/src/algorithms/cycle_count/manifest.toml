#
# The cycle_count manifest (PLAN Section 4.8). scripts/regen.py reads it (the algorithm tables,
# the CODEOWNERS block and the registries; `python3 scripts/regen.py` after an edit); CMake does not.
name        = "cycle_count"
title       = "Exact k-bounded directed simple-cycle histograms"
computes    = "k-bounded directed simple-cycle histograms"   # the "Computes" column of the algorithm tables
paper       = "TruCy / DynTruCy"
since       = "0.1"                     # the first release that contains it
family      = "aggregate_delta"
container   = "graph"
tier        = "custom_engine"
maturity    = "stable"                  # since 0.1.0 (decided 2026-09-30, GOVERNANCE.md)
backends    = ["sequential", "openmp", "cuda"]
determinism = "exact_value"
oracle      = "compute"
graph_requirements = { multi_edges = "forbid", row_order = "sorted", store_transposed = false }
cite        = ["trucy2026"]
maintainers = ["SMShovan"]
origin      = [ { repo = "CycleEnumeration-GPU", commit = "0a976ad", paths = ["src/sequential/johnson.cpp", "src/openmp/openmp_johnson.cpp", "src/dynamic/cycles_through_edge.cpp", "src/dynamic/update_sequential.cpp", "src/dynamic/update_openmp.cpp", "src/dynamic/directed_graph.cpp", "src/core/histogram.cpp",
                                                                 "src/cuda/cuda_static_kernels.cu", "include/cycle_enum/cuda/cuda_dfs.cuh", "include/cycle_enum/cuda/cuda_work_queue.hpp", "src/dynamic/update_cuda_kernel.cu"] } ]

[performance]
compute_tolerance    = 1.05
end_to_end_tolerance = 1.10
