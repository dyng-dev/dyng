#
# Algorithms whose port has not started (PLAN Section 6.2). scripts/regen.py lists them after the
# algorithms with a manifest.toml in the algorithm tables (README, the landing page, the
# algorithms index). An entry moves to cpp/src/algorithms/<name>/manifest.toml when its port
# starts (scripts/new_algorithm.py); regen.py rejects a name that has both.
[[planned]]
name      = "triad_count"
computes  = "hypergraph h-motif triad counts"
container = "hypergraph (ESCHER store)"
family    = "aggregate delta"
backends  = "sequential, OpenMP, CUDA"
paper     = "ESCHER / ESCHER+"
since     = "0.3"

[[planned]]
name      = "label_propagation"
computes  = "binary harmonic label propagation under vertex batches"
container = "graph"
family    = "fixed point"
backends  = "sequential, CUDA"
paper     = "DynLP (ICS 2026)"
since     = "0.4"

[[planned]]
name      = "hyper_sssp"
computes  = "shortest hyperpaths"
container = "hypergraph"
family    = "fixed point"
backends  = "sequential, CUDA"
paper     = "H-SOSP (IA3 2026)"
since     = "0.4"
