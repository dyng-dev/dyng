#
# Benchmark-suite record (PLAN Section 8.5) of dynG's `mosp`: the MOSP update of DynaMOSP (IPDPS
# 2025), the K = 3 per-objective SOSP updates plus the combined graph and its SOSP (Steps 2-3) and
# the MOSP path costs, which is what `mosp::update` computes. The suite reads the gates of M7
# (parity/results/M7.md sections 6 and 8; PLAN Sections 6.4.4 and 8.6): "(a) compute" and
# "(b) end to end" against the unpatched `bin/mosp` of MOSP-OpenMP@c352151 and MOSP-CUDA@e220ee2,
# and the device memory against MOSP-CUDA's, on the four graphs and three batches of the papers.
# The per-objective update alone is the sssp suite's (ipdps25_dynamosp_sosp.yaml); the K sweep of
# the TPDS extension is listed under `deferred`.
#
# Machine-readable: parity/bench_suite.py validates this file, checks the inputs against the
# SHA-256 digests below, and runs every reading through the A/B harness (parity/perf_ab.py mosp,
# parity/perf_ab.py memory --mosp) under the exclusive perf lock; the results JSON goes to
# benchmarks/results/<version>/. docs/developer/benchmarks.md describes the format. From 0.2.0 on
# parity/certify.py requires this suite's summary, with every gated region below, in a release
# certificate.
schema: 1
suite: ipdps25_dynamosp_mosp
title: "DynaMOSP: the MOSP update, K = 3 objectives and the combined graph (dynG mosp)"
algorithm: mosp
paper:
  short: DynaMOSP
  venue: IPDPS 2025
  scope: >-
    the papers' "(a) compute" (the K = 3 per-objective SOSP updates plus Steps 2-3, the combined
    graph and its SOSP from scratch) and "(b) end to end" (from reading the text inputs to writing
    every output file, the MOSP path costs included) of one batch per process, as the originals'
    bench/run.sh runs them; and the peak device memory of the CUDA update. The K sweep (K = 2..4 on
    roadNet-CA widened to four objectives) of the TPDS 2025 extension is reported, not gated
    (parity/results/M7.md section 5), and is not part of this suite (`deferred`).
harness:
  tool: perf_ab.mosp               # parity/perf_ab.py mosp | parity/perf_ab.py memory --mosp
  prepare: parity/perf_ab.py prepare --graph {dataset}
  inputs: $DYNG_SCRATCH/bench/mosp/{dataset}
  executable: tools/compat/dyng-compat-mosp
  presets: {openmp: parity, cuda: parity-cuda}
  region_map: parity/timed_regions/mosp.toml
  outputs: written by both sides (bench/run.sh), into a directory deleted after each run; before the timed rounds of every batch every output file of both is compared byte for byte
graph:
  num_weights: 3                   # K: every column of the prepared CSR (`mosp` without -k)
  random_weights: [1, 100, 12345]  # U[1, 100] per objective, seed 12345 (mospPrep mtx2csr)
  source: 0
  preferences: default             # all 1 (`mosp` without --pref)
  index_types: [int32, int32, int32]
