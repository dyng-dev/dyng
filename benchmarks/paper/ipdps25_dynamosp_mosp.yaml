deferred:      # in the papers, not in this suite
  - {name: ksweep, dataset: roadNet-CA-K4, objectives: [2, 3, 4], source: "parity/perf_ab.py prepare --graph roadNet-CA-K4 --widen roadNet-CA:4", reason: "the K sweep of the TPDS 2025 extension (tpds25_dynamosp): reported, not gated (parity/results/M7.md section 5)"}
batches:   # mospPrep changes <csr> 3 <n> <size> <insert %> 777 [--local <hops>] [--safe]
  - {name: safe50k, generator: legacy.change_batch, size: 50000, insert_fraction: 0.5, safe: true, seed: 777, directory: changes_50000_50_safe}
  - {name: unsafe50k, generator: legacy.change_batch, size: 50000, insert_fraction: 0.5, safe: false, seed: 777, directory: changes_50000_50}
  - {name: local10k, generator: legacy.change_batch, size: 10000, insert_fraction: 0.5, safe: true, mode: local, hops: dataset, seed: 777, directory: changes_local_10000_50_safe}
backends:
  openmp:
    threads: 28
    environment: OMP_PROC_BIND=close OMP_PLACES=cores (28 threads pinned to the physical cores)
    baseline: MOSP-OpenMP
  cuda:
    gpu: 0
    engine: automatic   # dyng-compat-mosp --cuda-engine (the default; the fused engine on the RTX A5000)
    environment: CUDA_MODULE_LOADING=EAGER (the original's own default); resources::warm_up() (dynG)
    baseline: MOSP-CUDA
runs:          # alternating original / port rounds (A/B/A/B), medians compared
  default: 21
  road_usa_g: 11
metrics:       # region (parity/timed_regions/mosp.toml) -> the dynG profiler stages it sums
  compute:
    gate: compute
    openmp: {original: "compute_ms (obj<k>/sosp_update_compute + combined_graph_compute)", port: [sssp.engine, mosp.combine, mosp.combined_sssp, mosp.finalize]}
    cuda: {original: "gpu_compute_ms (obj<k>/sosp_update_gpu + combined_graph_gpu)", port: [sssp.engine, mosp.combine, mosp.combined_sssp, mosp.finalize]}
  sosp_update:
    per_objective: true
    gate: none
    openmp: {original: "obj<k> SOSP update", port: [sssp.engine]}
    cuda: {original: "obj<k> SOSP update", port: [sssp.engine]}
  combined:
    gate: none   # PLAN 6.4.4 "watch: the combined step"
    openmp: {original: "comb combined graph + SOSP", port: [mosp.combine, mosp.combined_sssp, mosp.finalize]}
    cuda: {original: "comb combined graph + SOSP", port: [mosp.combine, mosp.combined_sssp, mosp.finalize]}
  end_to_end:
    gate: end_to_end
    openmp: {original: "end_to_end_ms (TOTAL_end_to_end)", port: [total.end_to_end]}
    cuda: {original: "end_to_end_ms (TOTAL_end_to_end)", port: [total.end_to_end]}
  path_costs:
    gate: none   # the port's side only (the originals compute them while writing mospCosts.txt)
    openmp: {original: "none", port: [mosp.path_costs]}
    cuda: {original: "none", port: [mosp.path_costs]}
  device_memory:
    gate: memory
    cuda: {original: "peak live device allocations of bin/mosp (nsys)", port: "peak live device allocations of dyng-compat-mosp --mosp --no-output (nsys)"}
baselines:     # the pinned originals, built from the UNPATCHED scratch copy (parity/build_reference.sh)
  MOSP-OpenMP: {commit: c35215135341d5b5d1553458afe4b2226edc38fb, variant: unpatched, backend: openmp}
  MOSP-CUDA: {commit: e220ee20d1b0948ece3df135a02d1b898264c22f, variant: unpatched, backend: cuda}
tolerance:     # PLAN 8.6: port / original median
  compute: 1.05
  compute_short: 1.10   # regions whose original median is below short_region_ms (>= 20 runs)
  short_region_ms: 10.0
  end_to_end: 1.10
  memory: 1.05
readings:      # what one execution of the suite runs (every reading x every dataset)
  - {name: openmp, kind: run, backend: openmp, gated: true}
  - {name: cuda, kind: run, backend: cuda, clocks: boost, gated: true}         # ADR 0018
  - {name: cuda-default-clocks, kind: run, backend: cuda, clocks: none, gated: false}  # ADR 0018: recorded, not gated
  - {name: cuda-memory, kind: memory, backend: cuda, gpu: 1, gated: true}
paper_reference:   # informational: the originals' published numbers on the 50K safe batch (PLAN 6.4.4, 8.5)
  hardware: RTX A5000 (sm_86), Xeon Gold 6258R
  compute_a_ms:
    cuda: {roadNet-PA: 18.5, roadNet-CA: 33.7, rgg: 83.0, road_usa_g: 377}
    openmp: {roadNet-PA: 63.2, roadNet-CA: 110, rgg: 166, road_usa_g: 1320}
  end_to_end_b_ms:
    cuda: {roadNet-PA: 794, roadNet-CA: 1250, rgg: 1630, road_usa_g: 12200}
    openmp: {roadNet-PA: 645, roadNet-CA: 1170, rgg: 1300, road_usa_g: 12900}
