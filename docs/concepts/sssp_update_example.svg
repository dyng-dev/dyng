  SPDX-License-Identifier: Apache-2.0
  -->
  <title id="t">The worked sssp example: the shortest-path tree before and after the batch that deletes 2 to 1 and inserts 2 to 3 with weight 1</title>
  <style>
    .bg { fill: #ffffff; stroke: #d1d5db; }
    .h { font: 600 15px sans-serif; fill: #111827; text-anchor: middle; }
    .n { fill: #ffffff; stroke: #111827; stroke-width: 1.8; }
    .v { font: 600 15px sans-serif; fill: #111827; text-anchor: middle; }
    .d { font: 12px sans-serif; fill: #374151; text-anchor: middle; }
    .w { font: 600 13px sans-serif; text-anchor: middle; }
    .x { font: 700 18px sans-serif; text-anchor: middle; }
    .k { font: 12px sans-serif; fill: #374151; }
  </style>
  <defs>
    <marker id="a-tree" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a-other" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <marker id="a-ins" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="a-del" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="1" y="1" width="698" height="318" rx="8" class="bg"/>
  <text x="185" y="26" class="h">Before: dist = (0, 3, 1, 4)</text>
  <line x1="79.8" y1="146.7" x2="168.4" y2="97.3" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a-other)"/>
  <text x="115.0" y="115.5" class="w" fill="#9ca3af">4</text>
  <line x1="79.7" y1="163.6" x2="168.6" y2="215.4" stroke="#2563eb" stroke-width="3" marker-end="url(#a-tree)"/>
  <text x="115.0" y="202.0" class="w" fill="#2563eb">1</text>
  <line x1="185.0" y1="208.0" x2="185.0" y2="107.0" stroke="#2563eb" stroke-width="3" marker-end="url(#a-tree)"/>
  <text x="197.0" y="161.5" class="w" fill="#2563eb">2</text>
  <line x1="202.0" y1="88.0" x2="286.0" y2="88.0" stroke="#2563eb" stroke-width="3" marker-end="url(#a-tree)"/>
  <text x="245.0" y="80.0" class="w" fill="#2563eb">1</text>
  <circle cx="65" cy="155" r="17" class="n"/>
  <text x="65" y="160" class="v">0</text>
  <text x="65" y="190" class="d">d=0</text>
  <circle cx="185" cy="88" r="17" class="n"/>
  <text x="185" y="93" class="v">1</text>
  <text x="185" y="60" class="d">d=3, p=2</text>
  <circle cx="185" cy="225" r="17" class="n"/>
  <text x="185" y="230" class="v">2</text>
  <text x="185" y="260" class="d">d=1, p=0</text>
  <circle cx="305" cy="88" r="17" class="n"/>
  <text x="305" y="93" class="v">3</text>
  <text x="305" y="60" class="d">d=4, p=1</text>
  <text x="530" y="26" class="h">After: dist = (0, 4, 1, 2)</text>
  <line x1="424.8" y1="146.7" x2="513.4" y2="97.3" stroke="#2563eb" stroke-width="3" marker-end="url(#a-tree)"/>
  <text x="460.0" y="115.5" class="w" fill="#2563eb">4</text>
  <line x1="424.7" y1="163.6" x2="513.6" y2="215.4" stroke="#2563eb" stroke-width="3" marker-end="url(#a-tree)"/>
  <text x="460.0" y="202.0" class="w" fill="#2563eb">1</text>
  <line x1="530.0" y1="208.0" x2="530.0" y2="107.0" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-del)"/>
  <text x="518.0" y="161.5" class="w" fill="#dc2626">2</text>
  <text x="540.0" y="161.5" class="x" fill="#dc2626">&#215;</text>
  <line x1="547.0" y1="88.0" x2="631.0" y2="88.0" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#a-other)"/>
  <text x="590.0" y="80.0" class="w" fill="#9ca3af">1</text>
  <line x1="541.2" y1="212.2" x2="637.5" y2="102.3" stroke="#16a34a" stroke-width="3" marker-end="url(#a-ins)"/>
  <text x="602.0" y="168.5" class="w" fill="#16a34a">1</text>
  <circle cx="410" cy="155" r="17" class="n"/>
  <text x="410" y="160" class="v">0</text>
  <text x="410" y="190" class="d">d=0</text>
  <circle cx="530" cy="88" r="22" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="530" cy="88" r="17" class="n"/>
  <text x="530" y="93" class="v">1</text>
  <text x="530" y="60" class="d">d=4, p=0</text>
  <circle cx="530" cy="225" r="17" class="n"/>
  <text x="530" y="230" class="v">2</text>
  <text x="530" y="260" class="d">d=1, p=0</text>
  <circle cx="650" cy="88" r="22" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="650" cy="88" r="17" class="n"/>
  <text x="650" y="93" class="v">3</text>
  <text x="650" y="60" class="d">d=2, p=2</text>
  <line x1="20" y1="291" x2="48" y2="291" stroke="#2563eb" stroke-width="3"/><text x="54" y="295" class="k">tree edge</text>
  <line x1="125" y1="291" x2="153" y2="291" stroke="#9ca3af" stroke-width="1.6"/><text x="159" y="295" class="k">other edge</text>
  <line x1="235" y1="291" x2="263" y2="291" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/><text x="269" y="295" class="k">deleted</text>
  <line x1="325" y1="291" x2="353" y2="291" stroke="#16a34a" stroke-width="3"/><text x="359" y="295" class="k">inserted</text>
  <circle cx="430" cy="291" r="8" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3"/><text x="444" y="295" class="k">invalidated subtree {1, 3}, then repaired</text>
</svg>
