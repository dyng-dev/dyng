#
# The documented divergences of the dynG CBST store's trace replays (M8a review; ADR 0040 section
# 3): for every golden set of parity/goldens.toml's cbst_trace group and every store preset it is
# replayed under (`parity/compare.py cbst_trace --store device [--policy <preset>]`), the number
# of documented divergences per rule over all its cases. A replay whose counts differ fails: a
# store defect that the comparator would label a documented divergence changes them (a planted
# compaction-padding defect raised mosp_escher_test's from 1 to 2,401 under the comparator before
# the review).
#
#   [<set>.<preset>]   rule = count  (an empty table: no documented divergence)
#
# The rules: construct_below_payload and construct_without_row_counts (ADR 0038, 0040),
# policy_difference, policy_mapping and policy_exception (the field set "policy" of
# dyng_default, criterion 10(c)). The counts are the head store's; parity/cbst_merge_steps.sh
# checks them at the head commit only. Update them only with the reason in parity/results.


