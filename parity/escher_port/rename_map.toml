#
# The rename map of the CBST store port (M8a step 3, commit c1 "transplant"; ADR 0038).
# parity/escher_port/transplant.py reads ESCHER-GPU@abcf9b2 with `git archive`-equivalent
# `git show`, assembles every target file from its parts, rewrites the includes, applies the
# [context] rules and then the whole-token renames of [names], replaces include guards with
# `#pragma once`, wraps the code in the namespace, adds the SPDX and provenance header, runs
# clang-format and finally applies the manual hunks (manual_hunks.patch). The result is the
# c1 tree of cpp/src/hypergraph/escher (transplant.py --check compares them).

schema = 1
origin = "ESCHER-GPU"
commit = "abcf9b2bd42f896ec3103a6835edf713ed5e416c"
namespace = "dyng::detail::escher"
target_dir = "cpp/src/hypergraph/escher"

# The target files (in cpp/src/hypergraph/escher) and the parts of ESCHER-GPU they are assembled
# from: whole files, or line ranges [first, last] (1-based, inclusive) in the order given.
[[file]]
target = "cbst_store.hpp"
brief = "The CBST store: node and context records, the host API (construct, rebuild, insert, append = fill, erase, remove_values = unfill) and the store object (ESCHER-GPU's CBSTOperations)."
parts = [{ path = "include/structure.hpp" }]

[[file]]
target = "cbst_store.cu"
brief = "The host side of the CBST store: construction, rebuild, best-fit insert with the surplus rebuild, fill with overflow segments and payload growth, erase, unfill, and the store object."
parts = [{ path = "structure/operations.cu" }]

[[file]]
target = "kernels.cuh"
brief = "Declarations of the CBST store's kernels."
parts = [{ path = "kernel/kernels.cuh" }]

[[file]]
target = "device_utils.cuh"
brief = "Device and host helpers of the CBST kernels: padded sizes and the 64-bit in-order rank of a heap position (the CBST layout)."
parts = [{ path = "kernel/device_utils.cuh" }]

[[file]]
target = "build_tree.cu"
brief = "Tree construction kernels: the empty heap-ordered tree, node records at their in-order rank, the tail metadata scan, the rebuild of the surplus insert."
parts = [{ path = "kernel/build_tree.cu" }]

[[file]]
target = "delete_avail.cu"
brief = "Erase kernels: locate the nodes, mark them available, and the level-wise subtree_avail reduction."
parts = [{ path = "kernel/delete_avail.cu" }]

[[file]]
target = "insert_reuse.cu"
brief = "Best-fit reuse kernels of insert: the order-statistic walk over deleted slots, the matching pipeline and the degree-binned reuse."
parts = [{ path = "kernel/insert_reuse.cu" }]

[[file]]
target = "payload.cu"
brief = "Fill kernels: the degree-binned appends into tail segments, the overflow plan, the overflow segments and their metadata."
parts = [{ path = "kernel/payload.cu" }]

[[file]]
target = "unfill.cu"
brief = "Unfill kernels: degree-binned removal of values from rows (serial over chained rows, warp and block compaction of one-segment rows)."
parts = [{ path = "kernel/unfill.cu" }]

[[file]]
target = "find.cu"
brief = "Debug lookups of keys and rows (ESCHER-GPU's findAndPrint)."
parts = [
  { path = "kernel/find.cu", lines = [1, 5] },
  { path = "kernel/motif_utils.cuh", lines = [11, 24] },
  { path = "kernel/find.cu", lines = [6, 56] },
]

[[file]]
target = "row_view.cuh"
brief = "The key-indexed row view of a CBST (the locator): offset, length and the first entry above the key of every row."
parts = [{ path = "include/row_view.hpp" }]

[[file]]
target = "locator.cu"
brief = "Builds the row view of a CBST: directly over one-segment rows, or over a sorted copy of chained rows."
parts = [
  { path = "kernel/locator.cu", lines = [1, 12] },
  { path = "kernel/delta_merge.cu", lines = [10, 19] },
  { path = "kernel/delta_merge.cu", lines = [46, 61] },
  { path = "kernel/delta_merge.cu", lines = [74, 104] },
  { path = "kernel/locator.cu", lines = [13, 153] },
]

[[file]]
target = "integrity.hpp"
brief = "The CBST integrity checker (a test oracle of the store): rows by BST search, reachability, tail metadata, disjoint segments."
parts = [{ path = "include/integrity.hpp" }]

[[file]]
target = "integrity.cu"
brief = "The CBST integrity checker: copies a tree to the host and checks it against the expected rows."
parts = [{ path = "structure/integrity.cu" }]

[[file]]
target = "flatten.cpp"
brief = "flatten_rows: the CBST construct layout of a list of rows (padded rows, INT_MIN terminators, 64-bit total, OpenMP)."
parts = [{ path = "utils/flatten.cpp" }]

# Includes of the originals and their replacements ("" drops the line).
[includes]
'"../include/structure.hpp"' = '"hypergraph/escher/cbst_store.hpp"'
'"structure.hpp"' = '"hypergraph/escher/cbst_store.hpp"'
'"../include/row_view.hpp"' = '"hypergraph/escher/row_view.cuh"'
'"../include/integrity.hpp"' = '"hypergraph/escher/integrity.hpp"'
'"../include/utils.hpp"' = '"hypergraph/escher/flatten.hpp"'
'"../include/printUtils.hpp"' = '"hypergraph/escher/transplant_shims.hpp"'
'"../kernel/kernels.cuh"' = '"hypergraph/escher/kernels.cuh"'
'"kernels.cuh"' = '"hypergraph/escher/kernels.cuh"'
'"device_utils.cuh"' = '"hypergraph/escher/device_utils.cuh"'
'"motif_utils.cuh"' = ''
'"delta_merge.cuh"' = ''

# Context-dependent renames (Python regular expressions, applied in order before [names]): the
# store object's fill and unfill become append and remove_values (PLAN Appendix B); the
# degree-bin counters keep their field names fill, reuse and unfill.
[[context]]
pattern = 'CBSTOperations::fill\b'
replacement = 'CBSTOperations::append'
[[context]]
pattern = 'CBSTOperations::unfill\b'
replacement = 'CBSTOperations::remove_values'
[[context]]
pattern = '\bvoid fill\('
replacement = 'void append('
[[context]]
pattern = '\bvoid unfill\('
replacement = 'void remove_values('

# Whole-token renames (identifiers, and the same words in comments and strings). Types, kernels
# and functions follow PLAN 4.4.1 (types and functions snake_case without _t; kernels
# <verb>_<object>_kernel, degree-binned <verb>_{thread,warp,block}_kernel); every other
# camelCase identifier of the ported files becomes its snake_case spelling. CUDA runtime and
# built-in names (cuda*, threadIdx, blockIdx, blockDim, atomicAdd) are not renamed.
