#
# The rename map of the CUDA slack_csr store (M11a step 3, the transplant commit c1; ADR 0089):
# MOSP_ESCHER@4b86159's H-SOSP device graph without its SOSP kernels: the incidence mirror
# (DeviceIncidence: its slot rules, uploads, build and the mirror check of hsosp/src/hsospDelta.cu),
# the slack CSR line graph (DeviceH2H and its last delta DeviceDelta, hsosp/include/hsosp.cuh; their
# lifecycle, buildDeviceH2H / buildCsr, applyDeltaPairs with expandDeltaKeysKernel, applyRowsWarp
# and scatterWeightsKernel, downloadRows of hsosp/src/hsospDevice.cu), and the order-free line-graph
# delta (deriveDelta and its kernels, hsosp/src/hsospDelta.cu). Not ported here: applyBatch (the
# container's commit runs its steps, ADR 0086), BatchTimes, the SOSP state and kernels (hyper_sssp,
# M11a step 4), the stale paragraph of hsosp.cuh:20-25 (the per-thread row apply it describes was
# replaced by applyRowsWarp).
#
#   python3 parity/escher_port/transplant.py --map parity/escher_port/rename_map_hsosp.toml \
#       --check --rev <transplant commit>
#
# regenerates the transplant (the same steps as rename_map.toml: assemble the parts, rewrite the
# includes, rename whole tokens, #pragma once, the namespace, the SPDX and provenance header,
# clang-format, then the manual hunks of manual_hunks_hsosp.patch). The original is read with
# `git show 4b86159:<path>` only (its working tree holds files that are not part of it).

schema = 1
origin = "MOSP_ESCHER"
original_dir = "MOSP_ESCHER"
commit = "4b86159ec0b3bfe6e18c718ff4bef1494d7276a5"
namespace = "dyng::detail::hyper::slack"
target_dir = "cpp/src/hypergraph"
hunks = "manual_hunks_hsosp.patch"
note = "parity/escher_port/rename_map_hsosp.toml (M11a, ADR 0089; the layout rules are described in cpp/src/hypergraph/slack_csr/slack_layout.hpp)."

[[file]]
target = "slack_csr/slack_csr_store.hpp"
brief = "The device side of slack_csr storage: the incidence mirror (hyperedge and vertex slack rows), the slack CSR line graph with its node weights, and the last batch's pair delta on the device (MOSP_ESCHER's DeviceIncidence, DeviceH2H and DeviceDelta)."
parts = [
  { path = "hsosp/include/hsosp.cuh", lines = [1, 4] },
  { path = "hsosp/include/hsosp.cuh", lines = [9, 18] },
  { path = "hsosp/include/hsosp.cuh", lines = [26, 35] },
  { path = "hsosp/src/hsospInternal.cuh", lines = [9, 11] },
  { path = "hsosp/src/hsospInternal.cuh", lines = [14, 24] },
  { path = "hsosp/include/hsosp.cuh", lines = [39, 172] },
  { path = "hsosp/include/hsosp.cuh", lines = [207, 216] },
  { path = "hsosp/src/hsospInternal.cuh", lines = [29, 45] },
  { path = "hsosp/include/hsosp.cuh", lines = [321, 321] },
]

[[file]]
target = "slack_csr/slack_csr_store.cu"
brief = "The incidence mirror of slack_csr storage on the device (its slot rules, uploads with tail room, build and the mirror check) and the lifecycle of the device line graph and its delta buffers (MOSP_ESCHER's DeviceIncidence, DeviceH2H and DeviceDelta)."
parts = [
  { path = "hsosp/src/hsospDelta.cu", lines = [28, 38] },
  { path = "hsosp/src/hsospDelta.cu", lines = [44, 47] },
  { path = "hsosp/src/hsospDelta.cu", lines = [54, 70] },
  { path = "hsosp/src/hsospDelta.cu", lines = [299, 590] },
  { path = "hsosp/src/hsospDevice.cu", lines = [487, 605] },
]

[[file]]
target = "line_graph/slack_csr_h2h.cu"
brief = "The slack CSR line graph on the device: its build from the host line graph (also the rebuild after a tail overflow) and the batch's pair delta applied one warp per row, rows that outgrow their slot moved to the tail (MOSP_ESCHER's buildDeviceH2H, buildCsr, applyDeltaPairs, applyRowsWarp, scatterWeightsKernel and downloadRows)."
parts = [
  { path = "hsosp/src/hsospDevice.cu", lines = [10, 20] },
  { path = "hsosp/src/hsospDevice.cu", lines = [26, 27] },
  { path = "hsosp/src/hsospDevice.cu", lines = [32, 39] },
  { path = "hsosp/src/hsospDevice.cu", lines = [54, 156] },
  { path = "hsosp/src/hsospDevice.cu", lines = [484, 485] },
  { path = "hsosp/src/hsospDevice.cu", lines = [606, 798] },
]

[[file]]
target = "line_graph/incidence_delta.cu"
brief = "incidence_delta on the device: the net sign per incidence, the candidate pairs of the vertex lists before and after the batch (the vertex mirror patched between the two passes), their classification by pre / post overlap, the post-batch hyperedge rows written into the mirror (MOSP_ESCHER's deriveDelta)."
parts = [
  { path = "hsosp/src/hsospDelta.cu", lines = [7, 26] },
  { path = "hsosp/src/hsospDelta.cu", lines = [28, 38] },
  { path = "hsosp/src/hsospDelta.cu", lines = [44, 47] },
  { path = "hsosp/src/hsospDelta.cu", lines = [54, 300] },
  { path = "hsosp/src/hsospDelta.cu", lines = [596, 880] },
]

[includes]
'"DynamicHypergraph.hpp"' = ''
'"HostHypergraph.hpp"' = '"hypergraph/slack_csr/slack_layout.hpp"'
'"hsosp.cuh"' = '"hypergraph/slack_csr/slack_csr_store.hpp"'
'"hsospInternal.cuh"' = ''

# The file comment of hsospDelta.cu without its @file / @brief lines (the generated header has its
# own): a plain comment.
[[context]]
pattern = '^ \* The host ships the changed incidences'
replacement = '/*\n * The host ships the changed incidences'
# hsosp.cuh's design paragraph as a plain comment (the generated header has the @file block).
[[context]]
pattern = '/\*\*\n \* The h2h line graph'
replacement = '/*\n * The h2h line graph'
# The scratch's comment keeps its word (the type is renamed below).
[[context]]
pattern = 'Scratch of the device-side'
replacement = 'The scratch of the device-side'
# B's inner namespace detail (hsospInternal.cuh) is not kept: the namespace of the map holds it.
[[context]]
pattern = '\bdetail::'
replacement = ''
[[context]]
pattern = 'namespace detail \{\n'
replacement = ''
[[context]]
pattern = '\} // namespace detail\n'
replacement = ''

