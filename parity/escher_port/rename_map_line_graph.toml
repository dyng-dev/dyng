#
# The rename map of the line-graph port (M8b step 2, the transplant commit; ADR 0042): ESCHER-GPU's
# sorted delta merge of the line graph (kernel/delta_merge.{cu,cuh}, structure/graph_maintenance.cu,
# include/graph_maintenance.hpp, include/frontier.hpp and the Batch record of include/batch.hpp),
# H2H only: the V2V merge (updateVertexGraph, PairTest, vertexPairCount / vertexPairGather,
# sortedIntersect) belongs to the coarse triangles of 0.4 and is not ported; rowHeadsKernel,
# chainedRowLengths, gatherChainedRows and pairValues are already in escher/locator.cu (M8a).
#
#   python3 parity/escher_port/transplant.py --map parity/escher_port/rename_map_line_graph.toml \
#       --check --rev <transplant commit>
#
# regenerates the transplant (the same steps as rename_map.toml: assemble the parts, rewrite the
# includes, rename whole tokens, #pragma once, the namespace, the SPDX and provenance header,
# clang-format, then the manual hunks of manual_hunks_line_graph.patch).

schema = 1
origin = "ESCHER-GPU"
commit = "abcf9b2bd42f896ec3103a6835edf713ed5e416c"
namespace = "dyng::detail::escher"
target_dir = "cpp/src/hypergraph/line_graph"
hunks = "manual_hunks_line_graph.patch"
note = "parity/escher_port/rename_map_line_graph.toml (M8b, ADR 0042; the store's encoding is described in cpp/src/hypergraph/escher/README.md)."

[[file]]
target = "sorted_merge.cuh"
brief = "The sorted delta merge of the line graph (H2H): the row delta, the batch it reads, the kernels and updateLineGraph (ESCHER-GPU's delta_merge.cuh and graph_maintenance.hpp, H2H part)."
parts = [
  { path = "kernel/delta_merge.cuh", lines = [1, 21] },
  { path = "include/batch.hpp", lines = [8, 16] },
  { path = "kernel/delta_merge.cuh", lines = [31, 33] },
  { path = "kernel/delta_merge.cuh", lines = [40, 57] },
  { path = "kernel/delta_merge.cuh", lines = [65, 68] },
  { path = "include/graph_maintenance.hpp", lines = [8, 20] },
]

[[file]]
target = "device_frontier.cuh"
brief = "The frontier of one delta phase on the device: the changed ids and a membership flag per id (ESCHER-GPU's DeviceFrontier)."
parts = [{ path = "include/frontier.hpp" }]

[[file]]
target = "sorted_merge.cu"
brief = "The sorted delta merge of the line graph on the device: the rows of the inserted hyperedges, the removals and mirrored additions, the per-key ranges, the merged rows and the rebuild of the H2H tree over them (ESCHER-GPU's updateLineGraph)."
parts = [
  { path = "kernel/delta_merge.cu", lines = [1, 8] },
  { path = "structure/graph_maintenance.cu", lines = [1, 16] },
  { path = "kernel/delta_merge.cu", lines = [10, 60] },
  { path = "kernel/delta_merge.cu", lines = [74, 74] },
  { path = "kernel/delta_merge.cu", lines = [105, 162] },
  { path = "kernel/delta_merge.cu", lines = [199, 259] },
  { path = "structure/graph_maintenance.cu", lines = [18, 231] },
]

[includes]
'"../include/row_view.hpp"' = '"hypergraph/escher/row_view.cuh"'
'"../include/structure.hpp"' = '"hypergraph/escher/cbst_store.hpp"'
'"../include/graph_maintenance.hpp"' = '"hypergraph/line_graph/sorted_merge.cuh"'
'"../include/frontier.hpp"' = '"hypergraph/line_graph/device_frontier.cuh"'
'"../kernel/delta_merge.cuh"' = '"hypergraph/line_graph/sorted_merge.cuh"'
'"delta_merge.cuh"' = '"hypergraph/line_graph/sorted_merge.cuh"'

