#
# The rename map of hyper_sssp's CUDA engine (M11a step 4, the transplant commit c1; ADR 0091):
# MOSP_ESCHER@4b86159's SOSP state and kernels as they are, engine::fused of hyper_sssp: its
# HsospState, UpdateConfig and UpdateStats (hsosp/include/hsosp.cuh), the recompute and update
# kernels (pullDistancesWarp, collectCandidatesWarp, the packed-word kernels of hsospUpdate:
# hsosp/src/hsospDevice.cu) and the host loops (HsospState's lifecycle, propagate,
# checkBlockSize, resetForRecompute, hsospRecompute, hsospUpdate). Not ported: compareDistances
# and countMismatchesKernel (the harness compares on the host), zeroDegreeKernel (the container's
# CSR apply zeroes the dead degrees, ADR 0089: the engine writes no container state), the device
# graph (the slack_csr store of M11a step 3, rename_map_hsosp.toml).
#
#   python3 parity/escher_port/transplant.py --map parity/escher_port/rename_map_hyper_sssp.toml \
#       --check --rev <transplant commit>
#
# regenerates the transplant (assemble the parts, rewrite the includes, rename whole tokens,
# #pragma once, the namespace, the SPDX and provenance header, clang-format, then the manual hunks
# of manual_hunks_hyper_sssp.patch). The original is read with `git show 4b86159:<path>` only.

schema = 1
origin = "MOSP_ESCHER"
original_dir = "MOSP_ESCHER"
commit = "4b86159ec0b3bfe6e18c718ff4bef1494d7276a5"
namespace = "dyng::detail::hsosp"
target_dir = "cpp/src/algorithms/hyper_sssp"
hunks = "manual_hunks_hyper_sssp.patch"
note = "parity/escher_port/rename_map_hyper_sssp.toml (M11a, ADR 0091)."

[[file]]
target = "state.cuh"
brief = "The device state of a CUDA hyper_sssp result (MOSP_ESCHER's HsospState: the distances and parents, the packed words, the invalidation and frontier arrays, the counters), the update's configuration and counters (UpdateConfig, UpdateStats), and the device graph as the engine reads it."
parts = [
  { path = "hsosp/include/hsosp.cuh", lines = [1, 2] },
  { path = "hsosp/include/hsosp.cuh", lines = [28, 31] },
  { path = "hsosp/include/hsosp.cuh", lines = [217, 313] },
  { path = "hsosp/include/hsosp.cuh", lines = [321, 321] },
]

[[file]]
target = "kernels.cuh"
brief = "The kernels of hyper_sssp's CUDA engine (MOSP_ESCHER's hsospRecompute kernels, one warp per candidate, and the packed-word kernels of hsospUpdate: pack and unpack, the roots, pointer jumping, invalidation, the pulls, the inserted pairs, the push)."
parts = [
  { path = "hsosp/src/hsospInternal.cuh", lines = [1, 2] },
  { path = "hsosp/src/hsospInternal.cuh", lines = [29, 32] },
  { path = "hsosp/src/hsospDevice.cu", lines = [26, 30] },
  { path = "hsosp/src/hsospDevice.cu", lines = [40, 52] },
  { path = "hsosp/src/hsospDevice.cu", lines = [157, 238] },
  { path = "hsosp/src/hsospDevice.cu", lines = [249, 326] },
  { path = "hsosp/src/hsospDevice.cu", lines = [331, 484] },
  { path = "hsosp/src/hsospDevice.cu", lines = [486, 486] },
  { path = "hsosp/src/hsospInternal.cuh", lines = [50, 50] },
]

[[file]]
target = "engine.cu"
brief = "hyper_sssp's CUDA engine (engine::fused): the device state's lifecycle and MOSP_ESCHER's host loops, the shared propagation of the recompute (propagate), hsospRecompute and hsospUpdate with their budget and fallback."
parts = [
  { path = "hsosp/src/hsospDevice.cu", lines = [9, 19] },
  { path = "hsosp/src/hsospDevice.cu", lines = [799, 1195] },
]

[includes]
'"hsosp.cuh"' = '"algorithms/hyper_sssp/state.cuh"'
'"hsospInternal.cuh"' = '"algorithms/hyper_sssp/kernels.cuh"'
'"DynamicHypergraph.hpp"' = ''
'"HostHypergraph.hpp"' = ''
'<cub/cub.cuh>' = ''
'<thrust/iterator/transform_iterator.h>' = ''

