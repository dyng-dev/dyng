#
# The pinned original repositories of the parity harness (PLAN Sections 6.3 and 8.3, R22).
#
# parity/build_reference.sh reads this file. For every reference it exports the pinned commit with
# `git archive` (the original repository is only read, never built in place and never changed)
# into
#     $DYNG_SCRATCH/ref/<name>@<commit>/unpatched   performance baselines
#     $DYNG_SCRATCH/ref/<name>@<commit>/patched     goldens (unpatched + additive export tools)
# and builds both with the original build system. $DYNG_SCRATCH is the persistent work area
# (default $HOME/Projects/dyng-work); never a session-specific temporary directory.
#
# Keys of a [[reference]]:
#   name            directory name of the original's clone (and of the scratch copy)
#   origin          where the clone of the original lives: $DYNG_ORIGINALS_DIR/<name>
#                   (build_reference.sh defaults DYNG_ORIGINALS_DIR to $HOME/Projects)
#   upstream        the original's public repository, to clone from (the harness never fetches)
#   commit          the pinned commit (full SHA): the port must match THIS commit
#   baseline_tag    local-only tag of the unfixed code that the papers measured (PLAN Section 6.1)
#   baseline_commit full SHA of that tag, recorded here because local tags do not travel (R22)
#   build           build command, run inside the copy; {jobs} is replaced by the job count
#   build_env       extra environment for the build (VAR=value strings)
#   cxx             the host C++ compiler, exported as CXX for the build and the export patch
#   run_env         environment every run of the reference needs
#   export_patch    directory under parity/export_patches/ applied to the PATCHED copy only;
#                   its build.sh receives the copy's path. "" = no patch (patched == unpatched)
#   smoke_test      the original's own test command, run by `build_reference.sh --test`
#   gitlinks        submodules / gitlinks that `git archive` leaves out (none here)
#   external_inputs inputs the archive does not contain (datasets, benchmark inputs)
#   toolchain       compilers and flags as built here
#   golden_sets     the sets of parity/goldens.toml exported from this reference (listed from M9a
#                   on; the sets of earlier milestones name their reference in goldens.toml)
schema = 1

[[reference]]
name = "MOSP-OpenMP"
origin = "$DYNG_ORIGINALS_DIR/MOSP-OpenMP"
upstream = "https://github.com/SMShovan/MOSP-OpenMP.git"
commit = "c35215135341d5b5d1553458afe4b2226edc38fb"
baseline_tag = "baseline-2026-09"
baseline_commit = "7284f5005e694eaa3466fd29bc0d12f7cf505a28"
build = "make -j{jobs} all stressTest parallelStressTest"
build_env = []
cxx = "/usr/bin/g++"
run_env = []
export_patch = "MOSP-OpenMP"
smoke_test = "make test TEST_THREADS=4"
gitlinks = []
external_inputs = [
  "SuiteSparse Matrix Market files for bench/prepare.sh (roadNet-PA, roadNet-CA, rgg_n_2_20_s0, road_usa); the prepared CSR files live under $DYNG_SCRATCH/datasets/mosp/<graph>/csr",
  "bench/baseline/build.sh archives the tag baseline-2026-09 from the ORIGINAL repository (git -C <repo> archive); it is not available inside an archive copy",
]
toolchain = "system g++ 12.2, Makefile defaults: -std=c++17 -Wall -Wextra -O3 -fopenmp"
notes = """
The M1a reference of sssp (CPU). Its drivers: bin/mosp (in-memory mospUpdate -> sospUpdateCpu,
per-objective stage timers, RESULT line), bin/mospPrep (mtx2csr, init, changes, expected),
bin/mospTest (oracle groups; --work keeps every case on disk), bin/stressTest and
bin/parallelStressTest (100 random cases each; they write their cases under the working directory).
The export patch adds two exporter programs (parity/exporters/mosp) linked against the unchanged
sources; no original file is modified.
"""

[[reference]]
name = "MOSP-CUDA"
origin = "$DYNG_ORIGINALS_DIR/MOSP-CUDA"
upstream = "https://github.com/SMShovan/MOSP-CUDA.git"
commit = "e220ee20d1b0948ece3df135a02d1b898264c22f"
baseline_tag = "baseline-2026-09"
baseline_commit = "ac29545c6ff21a05901cd124ce6760644a129263"
build = "make -j{jobs} all stressTest parallelStressTest NVCC=/usr/local/cuda-13.1/bin/nvcc"
build_env = []
cxx = "/usr/bin/g++"
run_env = ["CUDA_MODULE_LOADING=EAGER"]
export_patch = "MOSP-CUDA"
smoke_test = "make test NVCC=/usr/local/cuda-13.1/bin/nvcc"
gitlinks = []
external_inputs = [
  "the same prepared datasets as MOSP-OpenMP ($DYNG_SCRATCH/datasets/mosp)",
  "bench/baseline/build.sh archives the tag baseline-2026-09 from the ORIGINAL repository",
]
toolchain = "CUDA 13.1 nvcc, sm_86, host -O3, -lineinfo, --extended-lambda (Makefile defaults)"
notes = """
The M1b reference of sssp (CUDA). In M1a it is used once, for the cross-check
old MOSP-CUDA == old MOSP-OpenMP on the golden corpus (PLAN Section 6.3 step 2). Its bin/mosp has
the same command line and output files as MOSP-OpenMP's. The export patch builds the graph/io
exporter against the CUDA sources (applyChangeBatch of the CUDA repository).
"""

[[reference]]
name = "CycleEnumeration-GPU"
origin = "$HOME/Projects/CycleEnumeration-GPU"
upstream = "git@github.com:SMShovan/CycleEnumeration-GPU.git"
commit = "0a976adfa801a712135bf1adb51a228f353a0751"
baseline_tag = "baseline-2026-09"
baseline_commit = "da2067d62c2ce8f9234908089fa15bc53b5979c0"
build = "env NVCC=/usr/local/cuda-13.1/bin/nvcc cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCYCLE_ENUM_ENABLE_OPENMP=ON -DCYCLE_ENUM_ENABLE_CUDA=ON -DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.1/bin/nvcc -DCMAKE_CUDA_HOST_COMPILER=/usr/bin/g++ -DCMAKE_CUDA_ARCHITECTURES=86 && cmake --build build -j{jobs}"
build_env = []
cxx = "/usr/bin/g++"
run_env = ["CUDA_MODULE_LOADING=EAGER"]
export_patch = "CycleEnumeration-GPU"
smoke_test = "ctest --test-dir build --output-on-failure -j 8"
gitlinks = []
external_inputs = [
  "googletest v1.14.0, fetched by the original's tests/CMakeLists.txt (FetchContent from GitHub) at configure time",
  "TUDataset DD, COLLAB, github_stargazers, twitch_egos (*_A.txt) and the SNAP temporal edge lists under $DYNG_SCRATCH/datasets/cycle",
]
toolchain = "system g++ 12.2 and CUDA 13.1 nvcc (sm_86), CMake Release (-O3 -DNDEBUG), OpenMP and CUDA enabled as in the original's docs/RESULTS.md"
notes = """
The M2 reference of cycle_count, the graph container under graph_properties::cycle_enum_compatible(),
io::read_edge_list and generators::legacy::cycle_enum_batch. Its driver is build/cycle-enum
(--task count|update, --backend sequential|openmp|cuda; RESULTS.md measures OpenMP with 56 threads).
The export patch adds parity_export/bin/export_cycle_enum (parity/exporters/cycle_enum), compiled
against the unchanged sources; no original file is modified.
"""

[[reference]]
name = "ESCHER-GPU"
origin = "$DYNG_ORIGINALS_DIR/ESCHER-GPU"
upstream = "git@github.com:SMShovan/ESCHER-GPU.git"
commit = "abcf9b2bd42f896ec3103a6835edf713ed5e416c"
baseline_tag = "baseline-2026-09"
baseline_commit = "6a44c1cf5f1639721d35b418f99b420c5c45674e"
build = "make -j{jobs} all-types build/cbst_test NVCC=/usr/local/cuda-13.1/bin/nvcc ARCH=sm_86"
build_env = []
cxx = "/usr/bin/g++"
run_env = ["CUDA_MODULE_LOADING=EAGER"]
export_patch = "ESCHER-GPU"
smoke_test = "make test NVCC=/usr/local/cuda-13.1/bin/nvcc ARCH=sm_86"
gitlinks = [
  "Irregular Optimizations (gitlink 2591f3ed42508266e50678fa680d041052a8d9af; empty, no .gitmodules)",
  "Irregular-Graph-Optimizations-for-GPU (gitlink a1b334f2120c3078409a544d075d6036abad6ccd; empty, no .gitmodules)",
]
external_inputs = [
  "coauth-DBLP-full.tar.gz (Benson et al.; SHA-256 feb4bed6d3c79a9ba16142e71405b7eff1515504741281b8edfe13dc0f960433, pinned by bench/datasets/get_coauth.sh) under $DYNG_SCRATCH/datasets/hyper; the ESCHER variant coauth.hg is produced by the copy's bench/datasets/convert_coauth.py (datasets/registry.toml)",
  "bench/baseline/{setup,build,run}.sh archive the tag baseline-2026-09 from the ORIGINAL repository; they are not used by the parity harness",
  "tests/run_tests.sh writes its inputs (small.hg, skewed.hg, medium.hg) with awk (gawk 5.2.1 here) into a temporary directory; the CBST trace export captures them",
]
toolchain = "CUDA 13.1 nvcc, sm_86, -std=c++17 -O3 -lineinfo -Xcompiler -fopenmp (nvcc host compiler: /usr/bin/g++ 12.2 on PATH); C++ objects: the Makefile's hard-coded CXX = g++ (-std=c++17 -O3 -Wall -fopenmp)"
notes = """
The M8a reference of the ESCHER CBST store (ESCHER-GPU's CBSTOperations, PLAN 6.4.5) and the
M9 reference of triad_count. Executables: build/main (30-bin h-motif counts), build/type1..3,
build/coarseTriangle (all link the same CBST objects) and build/cbst_test (the layout test; it
links only build_tree.o and insert_reuse.o and calls no CBSTOperations function). The export
patch relinks the unchanged objects of every executable with the CBST trace recorder
(parity/exporters/escher) through -Xlinker --wrap; no original file is modified. The two gitlinks
are empty directories in the commit (no .gitmodules); git archive leaves them out and the build
never names them (archive-check.txt).
"""
golden_sets = [
  "cbst_trace_escher_gpu_test",
  "cbst_trace_escher_gpu_targeted",
  "cbst_trace_escher_gpu_coauth50k",
  "cbst_trace_escher_gpu_syn1m",
  # M9a: the triad counts of build/main and type1-3 on make-test and PLAN 6.4.6's grid, the
  # batches as .dgb files (parity/triad_goldens.py, ADR 0048)
  "triad_count_escher_gpu",
]

[[reference]]
name = "MOSP_ESCHER"
origin = "$DYNG_ORIGINALS_DIR/MOSP_ESCHER"
upstream = "git@github.com:SMShovan/MOSP_ESCHER.git"
commit = "4b86159ec0b3bfe6e18c718ff4bef1494d7276a5"
baseline_tag = "baseline-2026-09"
baseline_commit = "80cee6284aae8836e5319eabf5e8bd127c0dca82"
build = "make -j{jobs} all NVCC=/usr/local/cuda-13.1/bin/nvcc CUDA_ARCH=sm_86"
build_env = []
cxx = "/usr/bin/g++"
run_env = ["CUDA_MODULE_LOADING=EAGER"]
export_patch = "MOSP_ESCHER"
smoke_test = "make test NVCC=/usr/local/cuda-13.1/bin/nvcc CUDA_ARCH=sm_86"
gitlinks = []
external_inputs = [
  "coauth-DBLP-full.tar.gz (the same archive as ESCHER-GPU's); the H-SOSP variant coauth.hg is produced by the copy's scripts/benson_to_hg.py (datasets/registry.toml); hsospBench --maxcard 25 (its default) keeps 2,466,792 hyperedges",
  "tests/run_tests.sh writes random.hg with awk (gawk 5.2.1 here) into a temporary directory and builds tests/local with the host g++; the CBST trace export captures random.hg",
]
toolchain = "CUDA 13.1 nvcc, sm_86, -std=c++17 -O3 -lineinfo --extended-lambda -Xcompiler -fopenmp for .cu and .cpp (nvcc host compiler: /usr/bin/g++ 12.2 on PATH); tests/local: g++ -O2 -Wall -Wextra -std=c++17 -fopenmp"
notes = """
The M8a reference of the CBST store's second copy (MOSP_ESCHER's escher/, with compaction,
validation and the caller's row counts; PLAN 6.4.5) and the M11 reference of hyper_sssp. Only the
COMMITTED tree at 4b86159 is used: the clone's working tree has uncommitted changes (Makefile,
README.md, tests/run_tests.sh and untracked snapshot-experiment files) that build_reference.sh
never reads; its before/after check requires the clone's HEAD and `git status` to be unchanged,
not clean. The Makefile builds build/lib/libescher_core.a; the export patch relinks every
executable's unchanged objects and that archive with the CBST trace recorder
(parity/exporters/escher) through -Xlinker --wrap; no original file is modified.
"""
