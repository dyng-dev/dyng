#
# Timed-region map of cycle_count (PLAN Sections 6.3 step 3 and 8.6): each timer of the original ->
# the dynG profiler stages (or dyng-compat-cycle-enum report fields) that must be summed to match
# it. Written with the CPU port (M2a, before the performance runs); the CUDA regions (the original's
# kernel_ms / memcpy_ms / total_ms and the update on the device) were added with M2b, before its
# performance runs ([reference.cycle_enum_cuda] at the end).
#
# What the original times (CycleEnumeration-GPU@0a976ad src/cli/cycle_enum_main.cpp):
#   - `--task count` on the CPU backends prints no timer. docs/RESULTS.md reports the WALL TIME OF
#     THE PROCESS ("end to end": reading the file with read_graph_view(), building the CSR and CSC,
#     the count, printing the histogram).
#   - `--task update` prints `update_seconds=` (steady_clock around engine::update_histogram(),
#     i.e. update_static_histogram[_openmp]: prepare_batch, the delete phase on the initial graph,
#     apply_batch, the insert phase on the post-batch graph, apply_histogram_delta). The prior
#     histogram, build_directed_graph() and generate_batch() run before it and are not timed.
#
# dynG stage names: cycle_count.compute > { cycle_count.reset, cycle_count.count,
# cycle_count.finalize }; cycle_count.update > { cycle_count.normalize, cycle_count.count_minus,
# cycle_count.commit > { graph.apply }, cycle_count.identify_affected, cycle_count.count_plus,
# cycle_count.finalize }. With dyng::update(res, g, batch, results...) the commit is
# "update.commit" and the cycle_count stages appear once per cycle_count result. The update does not
# build the in-edges (no graph.transpose): cycle_count reads the out-edges only.
#
# dyng-compat-cycle-enum prints on standard error the original's `update_seconds=` and
#   RESULT task=<count|update> read_ms build_ms prior_ms generate_ms compute_ms update_ms
#          end_to_end_ms threads
# and, with --timing <csv>, the profiler rows (kind,name,value).
#
# Protocol of the gate (PLAN 8.6): the parity preset, medians of >= 5 runs alternating original and
# port (A/B/A/B), >= 20 runs for regions under 10 ms, 56 OpenMP threads as in the original's
# RESULTS.md (--openmp-threads 56), exclusive perf lock, the UNPATCHED copy's build/cycle-enum.
#
# This file is the definition of the regions: parity/perf_ab.py cycle_count (parity/
# cycle_count_perf.py) LOADS it and refuses to run if a region it gates is missing or a key is
# unknown to it.
#
# Field meanings (per region):
#   task             the CLI task the region belongs to: "count" or "update"
#   original         what the original's side measures (text)
#   original_report  where the harness reads it: "process wall time" (the harness's clock around
#                    the process) or a report field of the original's standard error
#                    ("update_seconds", converted to ms)
#   port             the dynG profiler stages of the same scope (--timing CSV; recorded next to
#                    the gated value as a breakdown and a cross-check of port_report)
#   port_report      where the harness reads the port's value: "process wall time" or a field of
#                    dyng-compat-cycle-enum's RESULT line ("update_ms", "compute_ms")
#   gate             "compute" (<= 1.05x; <= 1.10x when the original's median is below 10 ms, which
#                    then needs >= 20 runs), "end_to_end" (<= 1.10x) or "none" (reported only)

[reference.cycle_enum_openmp]
repo = "CycleEnumeration-GPU"
commit = "0a976ad"
driver = "build/cycle-enum of the UNPATCHED copy (--backend openmp --openmp-threads 56)"
port_driver = "dyng-compat-cycle-enum (tools/compat/cycle_enum), parity preset, --timing <csv>"

# The static count, end to end (the RESULTS.md table "Static simple cycles, OpenMP (56 threads),
# end to end"): the process wall time on both sides, measured by the harness around the process.
[[reference.cycle_enum_openmp.region]]
name = "static_end_to_end"
task = "count"
original = ["process wall time (cycle-enum --task count)"]
original_report = ["process wall time"]
port = []
port_report = ["process wall time"]
gate = "compute"    # the paper-timed region of the OpenMP count: <= 1.05 x at >= 10 ms
note = """
Both sides read the same file with the same parallel parser algorithm (io::read_edge_list is the
port of read_graph_view's parser), build the sorted CSR (the original also builds a CSC, which dynG
does not need), count, and print. The count alone is reported as well (static_count below)."""

# The count alone, reported (the original has no timer for it on the CPU backends).
[[reference.cycle_enum_openmp.region]]
name = "static_count"
task = "count"
original = []
original_report = []
port = ["cycle_count.compute"]
port_report = ["compute_ms"]
original_report_optional = ["count_seconds"]
gate = "none"
note = """
The port's cycle_count.compute (reset + count + finalize), i.e. the original's
count_simple_cycles_johnson[_openmp](). The unpatched original has no timer for it; the
instrumented experiment copies of parity/experiments/cycle_enum (stage_timers.patch) print
count_seconds (steady_clock around run_backend), and then the ratio is reported (never a gate)."""

[[reference.cycle_enum_openmp.region]]
name = "static_read"
task = "count"
original = []
original_report = []
original_report_optional = ["read_seconds"]
port = ["graph.build"]
port_report = ["read_ms", "build_ms"]
gate = "none"
note = """
Reading the edge list and building the graph: the port's read_ms + build_ms (io::read_edge_list and
graph::from_edges, the CSR only), the original's read_graph_view (the parser, the CSR and the CSC),
timed by the stage_timers experiment copy (read_seconds); reported, never a gate."""

# The incremental update (the RESULTS.md table "Incremental update", OpenMP-56 column).
[[reference.cycle_enum_openmp.region]]
name = "update"
task = "update"
original = ["update_seconds (engine::update_histogram)"]
original_report = ["update_seconds"]
port = ["cycle_count.update"]
port_report = ["update_ms"]
gate = "compute"
note = """
The same scope on both sides: Step 0 (prepare_batch / cycle_count.normalize), the delete phase on
G_t (cycle_count.count_minus), applying the batch (apply_batch / cycle_count.commit, which also
normalizes the batch again, as apply_batch sorts and deduplicates it again), the insert phase on
G_{t+1} (cycle_count.identify_affected + cycle_count.count_plus) and the histogram delta
(cycle_count.finalize). Not in the region on either side: the prior histogram, the graph build and
the batch generation. The original copies the whole graph in apply_batch (a new DirectedGraph);
dynG's commit also builds a new CSR (in parallel blocks), so the scopes match. update_ms is the
steady_clock time around cycle_count::update() in the driver, as update_seconds is around
update_histogram(); the stage cycle_count.update is recorded next to it."""

# The update task end to end (read, build, prior, generate, update, print), reported and gated as
# an end-to-end region.
[[reference.cycle_enum_openmp.region]]
name = "update_end_to_end"
task = "update"
original = ["process wall time (cycle-enum --task update)"]
original_report = ["process wall time"]
port = []
port_report = ["process wall time"]
gate = "end_to_end"
note = """
Includes the untimed parts of run_update() on both sides: reading the file, building the graph,
the prior histogram (the static count of the same backend) and generate_batch."""

# ------------------------------------------------------------------------------------------------
# The CUDA backend (M2b). What the original times (CycleEnumeration-GPU@0a976ad):
#   - `--task count --backend cuda --report-timing` prints on standard error "kernel_ms:",
#     "memcpy_ms:" and "total_ms:" from CUDA events (ScopedCudaTimers of
#     count_simple_cycles_johnson[_queue]_device): kernel = building the work items (forward rows,
#     scan, read-back, fill, the two-hop degrees and scan) + the counting kernel + the device
#     synchronization; memcpy = the upload of the 32-bit CSR + the copy of the histogram; total =
#     from before the upload to after the copy. docs/RESULTS.md reports kernel_ms ("the paper's
#     metric") and the process wall time.
#   - `--task update --backend cuda` prints `update_seconds=` (steady_clock around
#     update_histogram(): prepare_batch on the host, the upload of G_t, both device phases, the
#     device build of G_{t+1}, the copy of both histograms, apply_histogram_delta; the context is
#     created before, initialize_device()).
#
# dynG: `dyng-compat-cycle-enum --backend cuda`; the context and every kernel are loaded before the
# timed regions (resources::warm_up(), as the original's initialize_device() and occupancy
# queries). kernel_ms / memcpy_ms / total_ms of its RESULT line are CUDA-event times of the stages
# cycle_count.count (the work items + the counting kernel + the stream synchronization),
# graph.upload + cycle_count.finalize (the histogram copy) and cycle_count.compute
# (--report-timing). update_ms is the steady_clock time around cycle_count::update() (Step 0 in
# cycle_count.normalize, the delete phase in cycle_count.count_minus, the device apply in
# cycle_count.commit > graph.apply, the insert phase and the copy of the histograms in
# cycle_count.count_plus, the delta in cycle_count.finalize).
#
# Two scopes (PLAN 6.4.3; `scopes` below, dyng-compat-cycle-enum --scope):
#   original  the graph is uploaded inside the timed call, as the original uploads it per call
#             (count: the first compute() of the graph; update: G_t without a device copy);
#   resident  the graph is resident on the device before the timed call (dynG's model: the update
#             keeps the graph on the device across batches). An improvement, reported separately
#             (PLAN 8.6) and gated as well: it may only be faster. The count task uploads the graph
#             with an untimed count of the 2-cycles (a millisecond): a full count right before the
#             timed one leaves the GPU in the state of a long busy period, and the next kernel runs
#             5-12 % slower even at locked clocks (parity/results/M2b.md section 4.4); the update
#             task's graph is resident after the prior, which both sides run before the update.
#
# Protocol: PLAN 8.6 and ADR 0018 (option B): the parity-cuda preset, GPU 0, the clocks locked for
# the whole A/B (`--lock-clocks boost`, every busy sample checked), the exclusive perf lock, >= 20
# alternating runs for regions under 10 ms (else >= 5), medians; default-clock readings are
# recorded, not gated. Fields as above, plus `scopes` (the port scopes the region is read in) and
# `process` (main, the default: the port process of the scope; events or chain: an extra port
# process of the update cases, see the regions below).

[reference.cycle_enum_cuda]
repo = "CycleEnumeration-GPU"
commit = "0a976ad"
driver = "build/cycle-enum of the UNPATCHED copy (--backend cuda --cuda-device 0; CUDA_MODULE_LOADING=EAGER)"
port_driver = "dyng-compat-cycle-enum (tools/compat/cycle_enum), parity-cuda preset, --backend cuda --scope <scope> --timing <csv>"

[[reference.cycle_enum_cuda.region]]
name = "static_kernel"
task = "count"
original = ["kernel_ms (CUDA events: work items + counting kernel + synchronize)"]
original_report = ["kernel_ms"]
port = ["cycle_count.count"]
port_report = ["kernel_ms"]
scopes = ["original", "resident"]
gate = "compute"
note = """
The paper's metric (docs/RESULTS.md "Kernel"). The same region in both scopes (the upload is not in
it); the original allocates its item arrays with cudaMalloc inside the region, dynG leases them from
the workspace pool."""

[[reference.cycle_enum_cuda.region]]
name = "static_memcpy"
task = "count"
original = ["memcpy_ms (the CSR upload + the histogram copy)"]
original_report = ["memcpy_ms"]
port = ["graph.upload", "cycle_count.finalize"]
port_report = ["memcpy_ms"]
scopes = ["original", "resident"]
gate = "none"
note = "Reported. In the resident scope the port uploads nothing (only the histogram copy)."

[[reference.cycle_enum_cuda.region]]
name = "static_total"
task = "count"
original = ["total_ms (from before the upload to after the histogram copy)"]
original_report = ["total_ms"]
port = ["cycle_count.compute"]
port_report = ["total_ms"]
scopes = ["original", "resident"]
gate = "none"
note = "Reported: the whole static call on the device, with the upload in the original scope."

[[reference.cycle_enum_cuda.region]]
name = "static_end_to_end"
task = "count"
original = ["process wall time (cycle-enum --task count --backend cuda)"]
original_report = ["process wall time"]
port = []
port_report = ["process wall time"]
scopes = ["original"]
gate = "end_to_end"
note = """
docs/RESULTS.md "E2E": reading the file, building the graph, creating the context, the count and
printing. dynG's process also loads every library kernel (resources::warm_up())."""

[[reference.cycle_enum_cuda.region]]
name = "update"
task = "update"
original = ["update_seconds (engine::update_histogram, backend cuda)"]
original_report = ["update_seconds"]
port = ["cycle_count.update"]
port_report = ["update_ms"]
scopes = ["original", "resident"]
gate = "compute"
note = """
docs/RESULTS.md "Incremental update" (CUDA new). Scope original: dynG uploads G_t inside the call
(graph.upload), as the original does; scope resident: G_t is on the device already. In both, dynG
also applies the batch to its graph (the device merge of build_next_rows_kernel, which the original
runs as well but discards) and keeps G_{t+1} on the device."""

# The update's device time, dynG's side only (PLAN 8.6 asks for CUDA events or nsys kernel sums
# over >= 20 runs below 10 ms; the original's update region is host-side by construction: its
# update_seconds is a steady_clock around update_histogram(), which runs prepare_batch and
# apply_histogram_delta on the host, and it has no device timer). Read from a separate port process
# (`process = "events"`: --report-timing, CUDA events around every stage, whose synchronizations
# would perturb the gated host-clock region) for the cases whose original update is under 10 ms
# (cycle_count_perf.py --update-events). The ratio is against the original's host clock: a
# cross-check that the host clock of the short regions is not hiding device time, not a gate.
[[reference.cycle_enum_cuda.region]]
name = "update_device"
task = "update"
process = "events"
original = ["update_seconds (engine::update_histogram, backend cuda; the host clock)"]
original_report = ["update_seconds"]
port = ["cycle_count.update"]
port_report = ["update_device_ms"]
scopes = ["original", "resident"]
gate = "none"
note = """
dynG's CUDA-event time of the stage cycle_count.update (from the event before Step 0 to the event
after the histogram copy, on its stream), next to the original's host clock."""

# The resident graph across batches (PLAN 6.4.3; M2b review): --chain N updates on the same graph
# and result (`process = "chain"`, scope resident), the batches of seeds s .. s + N - 1 generated
# from the graph before the first update. The first update is the resident region above; the
# updates after it read a graph that a device apply produced (Step 0 against the device copy, no
# download). Steady: the median of the updates after the first; worst: the slowest update of the
# chain. Each against the original's per-call update, gated as the resident scope is.
[[reference.cycle_enum_cuda.region]]
name = "update_chain_steady"
task = "update"
process = "chain"
original = ["update_seconds (engine::update_histogram, backend cuda)"]
original_report = ["update_seconds"]
port = []
port_report = ["chain_steady_ms"]
scopes = ["resident"]
gate = "compute"
note = "The median of the chained updates after the first (steady_clock around each update())."

[[reference.cycle_enum_cuda.region]]
name = "update_chain_worst"
task = "update"
process = "chain"
original = ["update_seconds (engine::update_histogram, backend cuda)"]
original_report = ["update_seconds"]
port = []
port_report = ["chain_worst_ms"]
scopes = ["resident"]
gate = "compute"
note = "The slowest update of the chain, the first included."

[[reference.cycle_enum_cuda.region]]
name = "update_end_to_end"
task = "update"
original = ["process wall time (cycle-enum --task update --backend cuda)"]
original_report = ["process wall time"]
port = []
port_report = ["process wall time"]
scopes = ["original"]
gate = "end_to_end"
note = "Includes reading, building, the prior (the static CUDA count) and generate_batch."
