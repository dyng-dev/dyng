#
# Timed-region map of sssp (PLAN Sections 6.3 step 3 and 8.6): each timer of the original -> the
# dynG profiler stages whose host times are summed to match it. This file is the definition of
# the regions: parity/perf_ab.py LOADS it (the `original_report` keys it parses from the
# original's report lines, the `port*` stage lists it sums from dyng-compat-mosp's --timing CSV)
# and refuses to run if a region it reports is missing here or a key is unknown to it.
#
# Protocol of the gate (PLAN 8.6): medians of >= 5 runs (>= 20 when the original's median of a
# gated region is below 10 ms; otherwise the verdict is marked provisional), A/B/A/B, parity
# preset, 28 threads pinned with OMP_PROC_BIND=close OMP_PLACES=cores, under the perf lock.
#
# dynG stage names: sssp.update > { sssp.prepare, sssp.commit > { graph.apply, graph.transpose },
# sssp.workspace, sssp.identify_affected, sssp.seed, sssp.loop, sssp.finalize }; with dyng::update /
# update_each the commit is "update.commit" and the per-result stages repeat once per result, in
# result order. Building a result with from_arrays records sssp.import, [sssp.canonicalize],
# sssp.workspace and [sssp.validate]; building the graph records graph.build. dyng-compat-mosp
# writes the setup stages (graph.build, then one from_arrays set per objective in objective order)
# after the update's stages.
#
# Scratch memory (M1b, ADR 0015): the results share one workspace, the pooled workspace of the
# resources handle, exactly as mospUpdate() shares one SospWorkspace across the K objectives. The
# first from_arrays sizes it (sssp.workspace: the per-vertex arrays assigned, the six frontier
# lists only reserved, as SospWorkspace::reserve does); later leases are no-ops. So objective 0's
# region pays the first touch of the frontier-list pages it uses on both sides, and no cost is
# moved out of any region any more (M1a's sssp.workspace.pretouch stage and its "first touch
# counted" reading are gone).
#
# Field meanings (per region):
#   original                  the original's stage names (its ScopedStage / --timing CSV names)
#   original_report           the report lines of bin/mosp that perf_ab.py parses for them
#   original_report_subtract  report values subtracted from the original's side
#   per_objective             one value per objective k: the k-th sample of every `port` stage
#   port                      dynG stages of the update (summed; k-th sample if per_objective)
#   port_result0              from_arrays stages of objective 0's result only (sample 0)
#   port_all_results          from_arrays stages summed over the K results
#   gate                      "compute" (<= 1.05x; <= 1.10x below 10 ms), "end_to_end" (<= 1.10x,
#                             from M1b), or "none" (reported only)
# (port_result0, the from_arrays stages of objective 0's result only, is still understood by
#  perf_ab.py but no region uses it since M1b.)

[reference.mosp_openmp]
repo = "MOSP-OpenMP"
commit = "c352151"
driver = "bin/mosp of the UNPATCHED copy (report lines; the same timers as its --timing CSV)"
port_driver = "dyng-compat-mosp (tools/compat/mosp), parity preset, --timing <csv>"

# One objective's SOSP update, sospUpdateCpu() (pack the old tree, roots and chain-walk
# invalidation, insertion heads, pull pass, near-far propagation, unpack). THE gated region: one
# comparison per objective, as PLAN 6.4.2 defines it (never on the sum).
[[reference.mosp_openmp.region]]
name = "sosp_update"
per_objective = true
original = ["obj<k>/sosp_update_compute"]
original_report = ["obj<k> SOSP update"]
port = ["sssp.identify_affected", "sssp.seed", "sssp.loop", "sssp.finalize"]
gate = "compute"
note = """
The port's finalize also counts `affected` (vertices whose distance or parent changed) inside the
unpack pass.

First touch (since M1b): both sides use ONE workspace for the K objectives (MOSP's SospWorkspace;
dynG's pooled workspace, ADR 0015), whose six frontier lists (near, next near, far, far rebuild,
candidates, frontier) are reserved but not touched before objective 0 runs. Objective 0's region
therefore pays the first-touch page faults of the list pages it uses, on both sides, and
objectives 1..K-1 reuse the touched pages on both sides. Every objective is compared as measured.
(In M1a each result owned a workspace that from_arrays pre-touched outside the region; the A/B
then added that moved cost back to objective 0. That reading is withdrawn with its cause.)
"""

# The sum over the objectives: reported for orientation only. It is NOT a gate reading (PLAN
# 6.4.2 compares each objective); it hides a slower objective behind a faster one.
[[reference.mosp_openmp.region]]
name = "sosp_total"
per_objective = false
original = ["obj<k>/sosp_update_compute (all k)"]
original_report = ["obj<k> SOSP update"]
port = ["sssp.identify_affected", "sssp.seed", "sssp.loop", "sssp.finalize"]
gate = "none"
note = "Includes objective 0's first-touch cost on both sides (see sosp_update)."

# Applying the batch plus the original's "prepare". mospUpdate() times applyChangeBatch() as
# "apply_batch", then "prepare", which holds buildHostGraph() (the reverse graph and the
# objective-major weight columns) AND sospWorkspace.reserve(n) (packed, stamp, inFar, state
# assigned, about 28 MB; the six lists reserved), the copies of the K initial trees into the result
# (distances.assign, parents.assign: K x n x 12 bytes, about 71 MB), and combinedDistances /
# combinedParent.resize(n). dynG's update.commit does the graph work (graph.apply builds the new
# CSR, graph.transpose its in-edges; the objective-major columns are the storage layout); the tree
# copies and the one workspace reserve are done by from_arrays, outside the update, so they are
# added to the port's side here: every result's sssp.import (the K tree copies) and every
# sssp.workspace sample (the first from_arrays sizes the shared workspace; every other lease, in
# the setup or in the update, is a no-op of a few microseconds).
[[reference.mosp_openmp.region]]
name = "apply"
per_objective = false
original = ["apply_batch", "prepare"]
original_report = ["apply batch", "prepare"]
port = ["update.commit"]
port_all_results = ["sssp.import", "sssp.workspace"]
gate = "end_to_end"    # <= 1.10 x (PLAN 8.6), from M1b
note = """
Still only on the original's side: combinedDistances.resize(n) and combinedParent.resize(n)
(24 bytes per vertex zero-filled, about 47 MB on roadNet-CA, a few ms), which belong to the mosp
combined step (0.2). sssp.import also checks the parent ranges and normalizes INF, which the
original's assign does not; both biases are small and go in opposite directions. The largest
weight and the weight sum per objective are computed by mospUpdate() between "apply_batch" and
"prepare", outside both stages; dynG times them as sssp.prepare (end to end only).
"""

[[reference.mosp_openmp.region]]
name = "end_to_end"
per_objective = false
original = ["TOTAL_end_to_end", "- combined_graph_compute"]
original_report = ["end_to_end_ms"]
original_report_subtract = ["comb combined graph + SOSP"]
port = ["total.end_to_end"]  # written by dyng-compat-mosp next to the profiler rows
gate = "end_to_end"          # <= 1.10 x (PLAN 8.6), from M1b
note = """
Reading the text inputs to writing the outputs (--no-output on both, so nothing is written). Both
read the batch and the 2K tree files concurrently (runConcurrently / run_concurrently). The
original's TOTAL_end_to_end includes the combined graph and its SOSP (Steps 2-3 of the MOSP
update, "combined_graph_compute", reported as "comb combined graph + SOSP"), which belongs to the
mosp algorithm (0.2): perf_ab.py subtracts it from the original's side. The port's figure
includes building the graph (graph.build: the CSR's arrays are taken over, its in-edges are built
only for the updated graph, inside the commit) and the K results (import, workspace, validation of
the input trees, which `mosp` does not validate), which `mosp` does inside its load and "prepare"
stages.
"""

# --- MOSP-CUDA (M1b; draft, written before the CUDA port as PLAN Section 6.3 step 3 asks) ------
[reference.mosp_cuda]
repo = "MOSP-CUDA"
commit = "e220ee2"
driver = "bin/mosp (ScopedStage with CUDA events; CUDA_MODULE_LOADING=EAGER)"
port_driver = "dyng-compat-mosp --backend cuda (M1b)"

[[reference.mosp_cuda.region]]
name = "sosp_update"
per_objective = true
original = ["obj<k>/sosp_update_gpu"]        # device time (CUDA events) of sospUpdateGpu()
port = ["sssp.identify_affected", "sssp.seed", "sssp.loop", "sssp.finalize"]  # device_ms
gate = "compute"                             # <= 1.05 x; <= 1.10 x below 10 ms with >= 20 runs

[[reference.mosp_cuda.region]]
name = "apply"
per_objective = false
original = ["apply_batch_host", "upload"]
port = ["update.commit"]
gate = "end_to_end"

[[reference.mosp_cuda.region]]
name = "end_to_end"
per_objective = false
original = ["TOTAL_end_to_end", "- combined_graph_gpu"]  # it includes cuda_context_init too
port = ["total.end_to_end"]
gate = "end_to_end"
note = "exclude combined_graph_gpu (mosp, 0.2) and compare the context init separately"

# Logged only (not parity targets, PLAN Section 8.3): iterations, epochs, pushes (and MOSP-CUDA's
# jump rounds). The invalidated counter is deterministic and must be equal in every sample.
[counters]
equal = ["invalidated"]
logged = ["iterations", "epochs", "pushes"]
