#
# Read the Docs configuration (PLAN Section 9.2). NOT CONNECTED YET: the project is added on Read
# the Docs only after approval checkpoint A4 (milestone M6; docs/developer/repository_settings.md,
# step 13). Until then the site is built locally and by .github/workflows/docs.yml.
#
# The build uses the same conda environment as development and CI (environment.yml: the pinned
# Sphinx, Breathe and Doxygen), generates the Doxygen XML of the public headers exactly as
# ci/docs.sh does (it needs a configured tree for the generated version.hpp / config.hpp; no
# compiler run, no GPU), then builds the Sphinx site with warnings as errors. Keep these steps in
# sync with docs.yml.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "miniforge3-26.3"
  jobs:
    pre_build:
      - cmake --preset cpu-only -DDYNG_BUILD_TESTS=OFF -DDYNG_BUILD_EXAMPLES=OFF -DDYNG_BUILD_TOOLS=OFF
      - ci/docs.sh

conda:
  environment: environment.yml

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
