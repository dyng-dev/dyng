#
# Read the Docs configuration (PLAN Section 9.2). NOT USED: the documentation is hosted on GitHub
# Pages (the author's decision of 2026-10-02, PLAN Appendix F; .github/workflows/docs.yml deploys
# https://dyng-dev.github.io/dyng/ from main). The file is kept, and checked, so that Read the
# Docs (pull-request previews, version switching) can be connected later without new work
# (docs/developer/repository_settings.md, section 13).
#
# The build uses the same conda environment as development and CI (environment.yml: the pinned
# Sphinx, Breathe and Doxygen), generates the Doxygen XML of the public headers exactly as
# ci/docs.sh does (`--doxygen-only`: it needs a configured tree for the generated version.hpp /
# config.hpp; no compiler run, no GPU), then builds the Sphinx site itself with warnings as
# errors (the link check stays in ci/docs.sh and docs.yml). Keep these steps in sync with
# docs.yml.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "miniforge3-26.3"
  jobs:
    pre_build:
      - cmake --preset cpu-only -DDYNG_BUILD_TESTS=OFF -DDYNG_BUILD_EXAMPLES=OFF -DDYNG_BUILD_TOOLS=OFF
      - ci/docs.sh --doxygen-only

conda:
  environment: environment.yml

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
