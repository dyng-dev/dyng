#
# The single entry point for formatting and linting (PLAN Section 8.7):
#   pre-commit install              # once per clone
#   pre-commit run --all-files      # what ci/check.sh and lint.yml run
# clang-format is pinned to the same version as environment.yml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Test fixtures are byte-exact outputs of the original tools (and some inputs have
      # trailing blanks on purpose); the text fixers must not touch them.
      - id: trailing-whitespace
        exclude: ^cpp/tests/data/
      - id: end-of-file-fixer
        exclude: ^cpp/tests/data/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^cpp/tests/data/
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-added-large-files
        args: [--maxkb=256]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]  # not the Markdown code blocks (a published README among them)
  # The workflows: actionlint (syntax, expressions, runner labels; shellcheck on every `run:`
  # script) and zizmor (security audits: credentials, injection, permissions, pinning; offline).
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        additional_dependencies: ["shellcheck-py==0.11.0.1"]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --offline]
  - repo: local
    hooks:
      # Ported files carry '// Derived from <repo>@<sha>:<path>' (PLAN Sections 3.4, 6.3).
      - id: provenance
        name: provenance headers of ported files
        entry: python3 ci/provenance_check.py
        language: system
        pass_filenames: false
        always_run: true
      # Issue forms, labels, CODEOWNERS and the PR template are validated by GitHub only after a
      # push; this checks them, and the least-privilege and pinning rules of the workflows (and,
      # with --self-test, that broken inputs are rejected) locally. The SHA-to-tag check of the
      # action pins needs the network: `python3 ci/github_meta_check.py --verify-pins`.
      - id: github-meta
        name: .github metadata (issue forms, labels, CODEOWNERS, PR template, workflows)
        entry: python3 ci/github_meta_check.py --self-test
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        pass_filenames: false
        files: ^(\.github/|ci/github_meta_check\.py$)
