#
# The datasets of the parity harness and the benchmarks (PLAN Sections 4.2 and 5.7): name ->
# source -> SHA-256 -> how it is produced. No dataset is in the repository: the files live in the
# persistent work area ($DYNG_SCRATCH/datasets, default ~/Projects/dyng-work/datasets), and every
# derived file is produced by the ORIGINAL's own converter in a scratch copy of the pinned commit
# (parity/build_reference.sh) and checked against the SHA-256 below
# (`parity/cbst_trace_goldens.py datasets` re-derives and checks the coauth-DBLP variants).
#
# Keys of a [[dataset]]:
#   name         the dataset's name in the harness
#   kind         "archive" (as downloaded) or "derived" (produced from another entry)
#   file         its path under $DYNG_SCRATCH
#   sha256       the SHA-256 of the file
#   source       where the archive comes from (kind = "archive"), or the entry it is derived from
#   reference    the original whose converter produces it (references.toml), and `converter`
#                its script in the original's tree, run as `python3 <converter> <args>`
#   dyng_converter  dynG's own converter that writes the same bytes (run from the repository as
#                `python3 <dyng_converter> <args>`; M8b, ADR 0045)
#   cite         the reference to cite when the data is used
#   + the counts the original reports for the file
schema = 1

[[dataset]]
name = "coauth-DBLP-full"
kind = "archive"
file = "datasets/hyper/coauth-DBLP-full.tar.gz"
sha256 = "feb4bed6d3c79a9ba16142e71405b7eff1515504741281b8edfe13dc0f960433"
source = "the coauth-DBLP-full archive ('timestamped simplices and node labels') of Austin R. Benson's hypergraph data collection, https://www.cs.cornell.edu/~arb/data/coauth-DBLP/ (the Google Drive download named by ESCHER-GPU@abcf9b2:bench/datasets/get_coauth.sh, which pins this SHA-256); derived from the DBLP bibliography (September 3, 2017 release)"
cite = "Austin R. Benson, Rediet Abebe, Michael T. Schaub, Ali Jadbabaie and Jon Kleinberg. Simplicial closure and higher-order link prediction. PNAS, 2018. doi:10.1073/pnas.1800683115"
simplices = 3700681

# ESCHER-GPU's input (results/README.md, get_coauth.sh): one hyperedge per distinct author set
# (first occurrence kept), vertices relabeled densely 1..|V| in id order, sorted within a line.
[[dataset]]
name = "coauth-DBLP-escher"
kind = "derived"
file = "datasets/hyper/coauth.hg"
sha256 = "65fc83b22dfb3ecd14b15436f4aaee54631657f2f4afec8260150679387b7cb6"
source = "coauth-DBLP-full"
reference = "ESCHER-GPU"
converter = "bench/datasets/convert_coauth.py"
arguments = "coauth-DBLP-full/coauth-DBLP-full <out>.hg"
dyng_converter = "datasets/preprocess/benson_to_hg.py --variant escher"
hyperedges = 2467389
vertices = 1930378
pins = 7748737
max_cardinality = 280
note = "the SHA-256 equals the hg_sha of get_coauth.sh; re-derived on 2026-10-07 from the archive above"

# H-SOSP's input (MOSP_ESCHER results/README.md): scripts/benson_to_hg.py writes the SAME bytes as
# ESCHER-GPU's converter (both keep the first occurrence of every distinct vertex set and
# renumber the vertices 1..V in id order); the variants differ in how the originals LOAD the
# file: hsospBench's loader keeps hyperedges of at most --maxcard 25 vertices (its default) and
# adds the virtual source and target hyperedges.
[[dataset]]
name = "coauth-DBLP-hsosp"
kind = "derived"
file = "datasets/hyper/coauth.hg"
sha256 = "65fc83b22dfb3ecd14b15436f4aaee54631657f2f4afec8260150679387b7cb6"
source = "coauth-DBLP-full"
reference = "MOSP_ESCHER"
converter = "scripts/benson_to_hg.py"
arguments = "coauth-DBLP-full/coauth-DBLP-full <out>.hg"
dyng_converter = "datasets/preprocess/benson_to_hg.py --variant hsosp"
lines = 2467389
vertices = 1930378
loaded_hyperedges = 2466792
loaded_by = "bin/hsospBench --hg <file> (--maxcard 25, the default): 2,466,792 hyperedges kept, the count of MOSP_ESCHER's results/README.md; the bulk load recorded in the dblp50k batch dumps holds 2,466,794 rows (the virtual source, id 1, and target, id 2,466,794, added) and builds a line graph of 250,891,568 entries (125,445,784 pairs; parity/results/M8a.md)"

# coauth-MAG-Geology (M11a, HD15: decided by the author on 2026-10-28): Benson's Geology archives,
# downloaded on 2026-10-28 from the Google Drive links of the collection's page, and H-SOSP's input
# derived from them (parity/hsosp_goldens.py datasets re-derives and checks every entry below).
# The full archive (no restriction on the simplex size) re-derives to a DIFFERENT file than the
# one MOSP_ESCHER's results were measured on (e14e2558..., 1,204,704 lines, 1,261,129 vertices);
# that file, geology.hg (884e04ff...), is derived byte for byte, by both converters, from the
# collection's restricted archive coauth-MAG-Geology (simplices of at most 25 nodes), whose counts
# MOSP_ESCHER's results/README.md reports (1,203,895 hyperedges, 1,256,385 vertices) although it
# names the full archive. The goldens and the gates use geology.hg (parity/results/M11a.md
# section 2; decided by the author on 2026-10-29, GOVERNANCE.md approvals log).
[[dataset]]
name = "coauth-MAG-Geology-full"
kind = "archive"
file = "datasets/hyper/raw/coauth-MAG-Geology-full-2026-10-28/coauth-MAG-Geology-full.tar.gz"
sha256 = "798cf0fbfd0cd2bd8c9c7d4ece042f659849083f898b1332e24ccb4713778077"
source = "the coauth-MAG-Geology-full archive ('full data without restriction on simplex size: timestamped simplices, node labels, and simplex labels') of Austin R. Benson's hypergraph data collection, https://www.cs.cornell.edu/~arb/data/coauth-MAG-Geology/ (Google Drive id 1bk5uTnuijgHEAOi5sA-sM8Cxyg3Ejr43, downloaded 2026-10-28); derived from the Microsoft Academic Graph (publications tagged 'Geology'; authors as nodes, years as timestamps)"
cite = "Austin R. Benson, Rediet Abebe, Michael T. Schaub, Ali Jadbabaie and Jon Kleinberg. Simplicial closure and higher-order link prediction. PNAS, 2018. doi:10.1073/pnas.1800683115; and Arnab Sinha, Zhihong Shen, Yang Song, Hao Ma, Darrin Eide, Bo-June (Paul) Hsu and Kuansan Wang. An Overview of Microsoft Academic Service (MAS) and Applications. WWW 2015. doi:10.1145/2740908.2742839"
simplices = 1591166
derives_to = "e14e2558738c0d31f4a14260ee4f63ed2636c7753b530f166088f0c2a2ee78af"
derives_to_note = "scripts/benson_to_hg.py of MOSP_ESCHER@4b86159 and datasets/preprocess/benson_to_hg.py --variant hsosp both write 1,204,704 lines (1,261,129 vertices; 809 lines of more than 25 vertices) with this SHA-256: not the file of MOSP_ESCHER's results, so no entry uses it"

[[dataset]]
name = "coauth-MAG-Geology"
kind = "archive"
file = "datasets/hyper/raw/coauth-MAG-Geology-2026-10-28/coauth-MAG-Geology.tar.gz"
sha256 = "193d6f276191ad982958897cde94346c21e2fd0d9aec14f8f6583e2aab5cad24"
source = "the coauth-MAG-Geology archive ('data restricted to simplices with at most 25 nodes: timestamped simplices, node labels, and simplex labels') of Austin R. Benson's hypergraph data collection, https://www.cs.cornell.edu/~arb/data/coauth-MAG-Geology/ (Google Drive id 14MOWsEJyNGiFKumvmgMcU1CqekDBayYV, downloaded 2026-10-28); derived from the Microsoft Academic Graph"
cite = "Austin R. Benson, Rediet Abebe, Michael T. Schaub, Ali Jadbabaie and Jon Kleinberg. Simplicial closure and higher-order link prediction. PNAS, 2018. doi:10.1073/pnas.1800683115; and Arnab Sinha, Zhihong Shen, Yang Song, Hao Ma, Darrin Eide, Bo-June (Paul) Hsu and Kuansan Wang. An Overview of Microsoft Academic Service (MAS) and Applications. WWW 2015. doi:10.1145/2740908.2742839"
simplices = 1590335

# H-SOSP's Geology input (MOSP_ESCHER results/README.md: 1,203,895 hyperedges, 1,256,385 vertices
# at --maxcard 25; the file of its Geology rows, derived on 2026-09-26 in the MOSP_ESCHER fix
# effort): re-derived on 2026-10-28 from the restricted archive above with the same bytes by both
# converters.
[[dataset]]
name = "coauth-MAG-Geology-hsosp"
kind = "derived"
file = "datasets/hyper/geology.hg"
sha256 = "884e04ffef5d0caf0528230808dec742a41f59348402fe6b584b6c3323ce9de1"
source = "coauth-MAG-Geology"
reference = "MOSP_ESCHER"
converter = "scripts/benson_to_hg.py"
arguments = "coauth-MAG-Geology/coauth-MAG-Geology <out>.hg"
dyng_converter = "datasets/preprocess/benson_to_hg.py --variant hsosp"
lines = 1203895
vertices = 1256385
