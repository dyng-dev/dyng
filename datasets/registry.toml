loaded_by = "bin/hsospBench --hg <file> (--maxcard 25, the default): every line is kept (no line has more than 25 vertices); the counts of MOSP_ESCHER's results/README.md (parity/results/M11a.md section 2 records the loader's line of an unpatched run)"
note = "MOSP_ESCHER's results/README.md names coauth-MAG-Geology-full as the input; the full archive re-derives to another file (coauth-MAG-Geology-full, derives_to), this restricted archive to the measured one"
