# SPDX-FileCopyrightText: 2026 The dynG Authors
# SPDX-License-Identifier: Apache-2.0
#
# Licensing of files that cannot carry an SPDX comment header (PLAN Section 3.2).
# Source files (C++, CUDA, CMake, shell, Python, YAML) carry their own headers.
version = 1

[[annotations]]
path = [
  "**.md",
  "**.json",
  "**.cff",
  "**.txt",
  "VERSION",
  "NOTICE",
  "LICENSE",
  "**/LICENSE",
  "**/py.typed",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The dynG Authors"
SPDX-License-Identifier = "Apache-2.0"

# Test fixtures (tiny inputs and expected outputs; some produced by the pinned original tools, see
# parity/fixtures/graph_io/make_graph_io_fixtures.sh).
[[annotations]]
path = ["cpp/tests/data/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The dynG Authors"
SPDX-License-Identifier = "Apache-2.0"

# The fuzzers' seed corpus and crash reproducers (raw reader inputs, which cannot carry a header;
# cpp/fuzz/README.md).
[[annotations]]
path = ["cpp/fuzz/corpus/**", "cpp/fuzz/regressions/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The dynG Authors"
SPDX-License-Identifier = "Apache-2.0"

# The Code of Conduct is the Contributor Covenant 3.0 (CC BY-SA 4.0) with the reporting contact
# filled in, the placeholder note removed and an escalation paragraph for reports about the lead
# maintainer added.
[[annotations]]
path = ["CODE_OF_CONDUCT.md"]
precedence = "override"
SPDX-FileCopyrightText = ["Organization for Ethical Source", "2026 The dynG Authors"]
SPDX-License-Identifier = "CC-BY-SA-4.0"
