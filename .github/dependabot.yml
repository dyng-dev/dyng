# Keeps the SHA-pinned GitHub Actions up to date (PLAN Section 8.8).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week before proposing a new release: a compromised release is usually caught and
    # withdrawn within days (zizmor audit dependabot-cooldown).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
