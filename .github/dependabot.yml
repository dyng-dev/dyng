# Keeps the SHA-pinned GitHub Actions up to date (PLAN Section 8.8).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
