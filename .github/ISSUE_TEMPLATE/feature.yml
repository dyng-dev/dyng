name: Feature request
description: Propose a new feature or an improvement (for a new algorithm, use the "New algorithm" form).
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion! For open-ended ideas, a
        [Discussion](https://github.com/dyng-dev/dyng/discussions) is a good first step.
        New algorithms have their own form, and changes of the public API the "API change" form.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and why is it hard or impossible with dynG today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A sketch of the API (C++ or Python) helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, workarounds, or how other libraries do it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - an existing algorithm
        - core, graph or hypergraph containers
        - I/O (file formats)
        - Python package
        - command-line tools
        - build, packaging or installation
        - documentation
        - other
    validations:
      required: true
  - type: dropdown
    id: api-impact
    attributes:
      label: Effect on the public API
      options:
        - no effect
        - additive (new functions or options)
        - breaking (changes existing behaviour or signatures)
        - not sure
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement it?
      options:
        - "yes"
        - "yes, with guidance"
        - "no"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and discussions and this is not a duplicate.
          required: true
