name: Port research code
description: Propose porting an existing research implementation of a dynamic algorithm into dynG.
title: "[port] "
labels: ["port", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        A port keeps the original's behaviour exactly: it starts as a straight port with a
        provenance header on every file and parity goldens exported from the pinned original,
        followed by one pull request per refactor (the process is described in
        [CONTRIBUTING.md](https://github.com/dyng-dev/dyng/blob/main/CONTRIBUTING.md)). If the
        algorithm itself is new to dynG, please also describe it with the "New algorithm" form.

        Code written by others needs its copyright holders' consent: an open-source license
        that allows redistribution under Apache-2.0 (the code then keeps its original copyright
        and license notices, and is recorded in
        [docs/developer/provenance.md](https://github.com/dyng-dev/dyng/blob/main/docs/developer/provenance.md)),
        or, for code without a license, the written agreement of every copyright holder.
  - type: input
    id: repository
    attributes:
      label: Origin repository
      description: The URL of the repository that contains the research code.
      placeholder: https://github.com/<owner>/<repo>
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Pinned commit
      description: The full commit SHA the port (and its parity goldens) will be based on.
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Files to port
      description: The paths in the origin repository that the port will be derived from.
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License of the origin
      description: The SPDX identifier of the origin's license, or "none" if it has no license (then the authors' written agreement is needed, below).
      placeholder: Apache-2.0, MIT, BSD-3-Clause, none
    validations:
      required: true
  - type: textarea
    id: authors
    attributes:
      label: Authors and permission
      description: Who holds copyright in the code (every author, and their employer if it owns the rights), and are you one of them? For code without a license, how has each of them agreed in writing to its publication under Apache-2.0?
    validations:
      required: true
  - type: textarea
    id: paper
    attributes:
      label: Paper
      description: The publication(s) the code implements (citation, DOI or arXiv link).
  - type: input
    id: target
    attributes:
      label: Target dynG module
      description: The new or existing dynG algorithm this becomes (snake_case).
      placeholder: dynamic_kcore
    validations:
      required: true
  - type: textarea
    id: parity-plan
    attributes:
      label: Parity plan
      description: |
        Which outputs of the original are compared with dynG (distances, counts, output files),
        whether they must be byte-identical or equal within a stated tolerance (and why), how
        the golden inputs are generated, and which datasets are needed.
    validations:
      required: true
  - type: textarea
    id: deviations
    attributes:
      label: Known bugs or deviations of the original
      description: Differences between the paper and the code, known bugs, nondeterminism, hard-coded limits.
  - type: textarea
    id: performance
    attributes:
      label: Performance baseline
      description: The benchmarks of the original that the port should match (datasets, batch sizes, timed region).
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: The origin's license, or the written agreement of all its copyright holders, allows publishing the derived code under Apache-2.0, keeping any notices the license requires.
          required: true
        - label: I read "Adding an algorithm or porting research code" in CONTRIBUTING.md.
          required: true
