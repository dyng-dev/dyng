#
# The label taxonomy of dynG (PLAN Section 10.2), explained in docs/developer/labels.md.
# .github/workflows/labels.yml applies this file to the repository on every push to main that
# changes it (and checks it, without applying, on pull requests). Change labels HERE, not in the
# GitHub web interface: labels that are not listed are left alone, but a listed label is reset
# to the colour and description below. To rename a label, add `from_name: <old name>`.
# Fields: name, color ("#rrggbb"), description (at most 100 characters).

# --- Kind of issue or pull request ------------------------------------------------------------
- name: "bug"
  color: "#d73a4a"
  description: "Wrong result, crash, build failure or other defect"
- name: "enhancement"
  color: "#a2eeef"
  description: "A new feature or an improvement of an existing one"
- name: "documentation"
  color: "#0075ca"
  description: "Documentation: guides, API reference, examples, docstrings"
- name: "performance"
  color: "#fbca04"
  description: "Slower than expected, or a performance regression"
- name: "question"
  color: "#d876e3"
  description: "A question; usually better asked in GitHub Discussions"
- name: "new-algorithm"
  color: "#5319e7"
  description: "Proposal or work on a new dynamic algorithm (new_algorithm issue form)"
- name: "port"
  color: "#7e57c2"
  description: "Porting research code into dynG (port_research_code issue form)"
- name: "parity"
  color: "#e99695"
  description: "Parity with the original research codes: differences, regressions, goldens"
- name: "api-change"
  color: "#b60205"
  description: "Changes the public C++ or Python API: CHANGELOG, docs, docs/developer/api_review_checklist.md"
- name: "security"
  color: "#ee0701"
  description: "Hardening work; report vulnerabilities privately (SECURITY.md), not in issues"
- name: "dependencies"
  color: "#0366d6"
  description: "Dependency updates (dependabot)"
- name: "github_actions"
  color: "#000000"
  description: "GitHub Actions updates (dependabot)"

# --- Status -----------------------------------------------------------------------------------
- name: "triage"
  color: "#ededed"
  description: "New; waiting for a first look by a maintainer"
- name: "needs-info"
  color: "#f9d0c4"
  description: "Waiting for more information from the reporter"
- name: "needs-repro"
  color: "#f9d0c4"
  description: "A maintainer could not reproduce it yet; a minimal reproducer is needed"
- name: "blocked"
  color: "#b60205"
  description: "Waiting on another issue, a decision or an external party"
- name: "release-blocker"
  color: "#b60205"
  description: "Must be resolved before the next release"
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "#e4e669"
  description: "Not a problem with dynG, or not reproducible as described"
- name: "wontfix"
  color: "#ffffff"
  description: "Will not be worked on (the reason is given in a comment)"

# --- Contributors -----------------------------------------------------------------------------
# `good first issue` and `help wanted` are GitHub's standard names: GitHub lists issues with them
# on the repository's /contribute page. A good first issue also gets one category label below.
- name: "good first issue"
  color: "#7057ff"
  description: "Suitable for a first contribution; see CONTRIBUTING.md"
- name: "good-first-issue:op"
  color: "#9f8fff"
  description: "Good first issue: a new hypergraph pattern Op (from 0.2)"
- name: "good-first-issue:reader"
  color: "#9f8fff"
  description: "Good first issue: a reader or writer for a file format"
- name: "good-first-issue:backend"
  color: "#9f8fff"
  description: "Good first issue: an OpenMP backend for a sequential-only algorithm"
- name: "good-first-issue:docs"
  color: "#9f8fff"
  description: "Good first issue: documentation, examples or tutorials"
- name: "help wanted"
  color: "#008672"
  description: "A larger task where outside help is welcome"

# --- CI requests (added by maintainers only) --------------------------------------------------
- name: "ci:gpu"
  color: "#0e8a16"
  description: "Maintainer: run the GPU tests on this pull request (ci/gpu_local.sh or gpu-test)"
- name: "ci:bench"
  color: "#0e8a16"
  description: "Maintainer: run the benchmark comparison against main on this pull request"

