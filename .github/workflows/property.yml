#
# The long property runs (PLAN Section 8.1, "nightly (a small Hypothesis profile runs per PR)"):
# the pytest suite with the Hypothesis profile `full` of python/tests/conftest.py (10,000 examples
# per property by default, not derandomized: every run explores new inputs) on GitHub-hosted
# runners, weekly and on demand. The per-pull-request runs (python.yml) use the derandomized
# profile `ci`. A failure prints Hypothesis' @reproduce_failure blob: paste it above the failing
# test to replay the input, fix the bug, and add the input as an explicit example (@example).
# Not a required check.
name: property

on:
  schedule:
    - cron: "23 3 * * 6"  # Saturdays 03:23 UTC
  workflow_dispatch:
    inputs:
      examples:
        description: "Examples per property"
        required: false
        default: "10000"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hypothesis-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build tools (the pins of pyproject.toml and environment.yml)
        run: |
          python -m pip install "cmake>=3.30,<4.5" ninja "scikit-build-core==1.1.0" \
            "nanobind==3.1.0" numpy "pytest>=8" "hypothesis==6.167.1" "mypy==1.18.2"
      - name: Examples per property
        id: examples
        env:
          REQUESTED: ${{ inputs.examples }}
        run: |
          examples="${REQUESTED:-10000}"
          case "${examples}" in
            '' | *[!0-9]*) echo "examples must be a whole number, got '${examples}'" >&2; exit 1 ;;
          esac
          echo "examples=${examples}" >> "${GITHUB_OUTPUT}"
      - name: ci/python.sh with the Hypothesis profile `full`
        env:
          DYNG_HYPOTHESIS_PROFILE: full
          DYNG_HYPOTHESIS_EXAMPLES: ${{ steps.examples.outputs.examples }}
          OMP_NUM_THREADS: "2"
        run: ci/python.sh
