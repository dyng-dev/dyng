#
# Release: build the Python distributions and publish them with PyPI Trusted Publishing
# (OIDC; no API tokens). The trusted publishers on TestPyPI and PyPI are bound to THIS file name
# (release.yml) and to the GitHub environments `testpypi` and `pypi`: never rename them.
#
# Triggered by a tag `v*` (tags are created by the author only; the `release tags` ruleset):
#   * the tag must equal the version of the package being released (checked below);
#   * every release goes to TestPyPI first; final versions then go to PyPI, which needs the
#     author's approval (the required reviewer of the `pypi` environment); pre-releases
#     (a, b, rc, dev) stop at TestPyPI.
#
# What is built is decided by the `select` job; the publish jobs are the same for both:
#   * v0.0.x equal to tools/name_reservation's version (0.0.1): the name-reservation package
#     (approval checkpoint A3; ADR 0014), built by the `reservation` job;
#   * v0.1.0 and later (milestone M5; ADR 0025): the real distributions of the root
#     pyproject.toml, the sdist and the CPU wheel (manylinux_2_28 x86_64, abi3), built and tested
#     by wheels.yml (called as a reusable workflow) and checked again by the `collect` job.
# Both paths end in one artifact `dist` that the publish jobs upload unchanged.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select the package for this tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.select.outputs.kind }}
      version: ${{ steps.select.outputs.version }}
      prerelease: ${{ steps.select.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Select the package for this tag
        id: select
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          reservation_version="$(python -c 'import tomllib; print(tomllib.load(open("tools/name_reservation/pyproject.toml","rb"))["project"]["version"])')"
          if [ "${tag}" = "${reservation_version}" ]; then
            kind=reservation
            version="${reservation_version}"
          elif printf '%s' "${tag}" | grep -Eq '^0\.0\.'; then
            echo "::error::tag v${tag}: 0.0.x tags are the name reservation (${reservation_version}) only"
            exit 1
          else
            kind=package
            version="$(tr -d '[:space:]' < VERSION)"
            if [ "${version}" != "${tag}" ]; then
              echo "::error::tag v${tag} does not match VERSION ${version} (bump VERSION and CITATION.cff first: docs/developer/release.md)"
              exit 1
            fi
          fi
          if printf '%s' "${version}" | grep -Eq '(a|b|rc|dev)[0-9]*$'; then
            prerelease=true
          else
            prerelease=false
          fi
          {
            echo "kind=${kind}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"
          echo "tag v${tag}: ${kind} ${version} (pre-release: ${prerelease})"

  reservation:
    name: Build the name-reservation package
    needs: select
    if: needs.select.outputs.kind == 'reservation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir dist tools/name_reservation
      - name: Check metadata
        run: twine check --strict dist/*
      - name: Smoke test the wheel
        env:
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          "${RUNNER_TEMP}/smoke/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/smoke/bin/python" -c "import os, dyng; assert dyng.__version__ == os.environ['VERSION'], dyng.__version__"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reservation-dist
          path: dist/
          if-no-files-found: error

  package:
    name: Build the distributions (wheels.yml)
    needs: select
    if: needs.select.outputs.kind == 'package'
    uses: ./.github/workflows/wheels.yml  # zizmor: ignore[self-repository] the syntax actionlint validates

  collect:
    name: Collect and check the distributions
    needs: [select, reservation, package]
    # One of the two build jobs ran (the other is skipped) and none failed.
    if: ${{ !cancelled() && needs.select.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: The name-reservation package
        if: needs.select.outputs.kind == 'reservation'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: reservation-dist
          path: dist/
      - name: The sdist of wheels.yml
        if: needs.select.outputs.kind == 'package'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist/
      - name: The wheels of wheels.yml
        if: needs.select.outputs.kind == 'package'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - name: twine check; the package's distributions again (versions, tags, size budget)
        env:
          KIND: ${{ needs.select.outputs.kind }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          python -m pip install twine
          ls -l dist/
          twine check --strict dist/*
          if [ "${KIND}" = "package" ]; then
            test -f "dist/dyng-${VERSION}.tar.gz"
            ls dist/dyng-"${VERSION}"-cp312-abi3-*manylinux_2_28_x86_64*.whl
            python ci/wheel_check.py dist/* --platform manylinux_2_28_x86_64 --require-libgomp
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [select, collect]
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dyng
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [select, collect, publish-testpypi]
    if: ${{ !cancelled() && needs.publish-testpypi.result == 'success' && needs.select.outputs.prerelease == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/dyng
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
