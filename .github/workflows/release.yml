#
# Release: build the Python distributions and publish them with PyPI Trusted Publishing
# (OIDC; no API tokens). The trusted publishers on TestPyPI and PyPI are bound to THIS file name
# (release.yml) and, per project, to GitHub environments: `dyng` to `testpypi` and `pypi`, the
# CUDA plugins `dyng-cu12` to `testpypi-cu12` and `pypi-cu12`, `dyng-cu13` to `testpypi-cu13` and
# `pypi-cu13` (PyPI refuses two identical pending publishers, so each plugin has its own pair).
# Never rename the file or the environments.
#
# Triggered by a tag `v*` (created by the author, or by the AI assistant on the author's behalf,
# GOVERNANCE.md 2026-09-30; the `release tags` ruleset):
#   * the tag must equal the version of the package being released (checked below);
#   * every release goes to TestPyPI first; final versions then go to PyPI, which needs the
#     author's approval (the required reviewer of each `pypi*` environment: one approval per
#     distribution, three for a release with the plugins); pre-releases (a, b, rc, dev) stop at
#     TestPyPI.
#
# What is built is decided by the `select` job; the publish jobs are the same for both:
#   * v0.0.x equal to tools/name_reservation's version (0.0.1): the name-reservation package
#     (approval checkpoint A3; ADR 0014), built by the `reservation` job;
#   * v0.1.0 and later (milestone M5; ADR 0025): the real distributions of the root
#     pyproject.toml, the sdist and the CPU wheel (manylinux_2_28 x86_64, abi3), built and tested
#     by wheels.yml (called as a reusable workflow) and checked again by the `collect` job;
#   * v0.2.0 and later, release candidates included (PLAN Appendix F; ADR 0032): also the CUDA
#     plugin wheels dyng-cu12 and dyng-cu13, built from the same sdist by wheels.yml.
# `select` names the distributions of the tag (ci/wheel_check.py --release-distributions);
# `collect` checks that the files are exactly those and sorts them into one directory per
# distribution in one artifact `dist`; the publish jobs run once per distribution, each in that
# distribution's environment, and upload its directory unchanged. On each index the CUDA plugins
# go first (a matrix over dyng-cu12 / dyng-cu13) and `dyng` only after every plugin upload
# succeeded: `dyng`'s extras pin `dyng-cuN==<version>`, and a `dyng` without its plugin on the
# index would make `pip install "dyng[cu13]"` fall back silently to an older dyng without the
# extra. Order: TestPyPI plugins, TestPyPI dyng, then (final versions) PyPI plugins, PyPI dyng.
# ci/tests/test_release_select.py runs the `select` step's script for the tag kinds.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select the package for this tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      kind: ${{ steps.select.outputs.kind }}
      version: ${{ steps.select.outputs.version }}
      prerelease: ${{ steps.select.outputs.prerelease }}
      plugins: ${{ steps.select.outputs.plugins }}
      distributions: ${{ steps.select.outputs.distributions }}
      plugin_distributions: ${{ steps.select.outputs.plugin_distributions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Select the package for this tag
        id: select
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          reservation_version="$(python -c 'import tomllib; print(tomllib.load(open("tools/name_reservation/pyproject.toml","rb"))["project"]["version"])')"
          if [ "${tag}" = "${reservation_version}" ]; then
            kind=reservation
            version="${reservation_version}"
            prerelease=false  # 0.0.1, a final version
            distributions="[{\"name\":\"dyng\",\"prefix\":\"dyng-${version}\",\"suffix\":\"\"}]"
          elif printf '%s' "${tag}" | grep -Eq '^0\.0\.'; then
            echo "::error::tag v${tag}: 0.0.x tags are the name reservation (${reservation_version}) only"
            exit 1
          else
            kind=package
            # VERSION must be canonical PEP 440 (the distributions carry that spelling); the same
            # parse says whether it is a pre-release (a, b, rc, dev), which stops at TestPyPI.
            if ! info="$(python ci/wheel_check.py --version-info)"; then
              echo "::error::VERSION is not a canonical PEP 440 version (0.1.0, 0.1.0rc1; not 0.1.0-rc.1): docs/developer/release.md"
              exit 1
            fi
            version="${info% *}"
            prerelease="${info#* }"
            if [ "${version}" != "${tag}" ]; then
              echo "::error::tag v${tag} does not match VERSION ${version}: for a release candidate VERSION holds X.Y.ZrcN, for the release X.Y.Z (steps 5 and 9 of docs/developer/release.md)"
              exit 1
            fi
            # VERSION, CHANGELOG.md and CITATION.cff must agree (the version, the section and its
            # date, the link references); the date should be the day of the tag (checked before
            # tagging, step 7 / 10 of docs/developer/release.md; only a warning here).
            if ! python ci/wheel_check.py --release-metadata; then
              echo "::error::VERSION, CHANGELOG.md and CITATION.cff disagree (steps 5, 6 and 9 of docs/developer/release.md)"
              exit 1
            fi
            if ! python ci/wheel_check.py --release-metadata --release-date today; then
              echo "::warning::the release date of CHANGELOG.md and CITATION.cff is not today (UTC)"
            fi
            # The core alone up to v0.1.x; from v0.2.0 also the CUDA plugins (wheel_check.py's
            # PLUGINS_SINCE), each with its own environments (testpypi-cuN / pypi-cuN).
            distributions="$(python ci/wheel_check.py --release-distributions)"
          fi
          # The core `dyng` is published by its own jobs, after the plugins (the list must hold
          # it exactly once, with the environments testpypi / pypi); the plugins' matrix gets the
          # rest.
          plugin_distributions="$(python -c 'import json, sys
          d = json.loads(sys.argv[1])
          core = [x for x in d if x["name"] == "dyng"]
          assert len(core) == 1 and core[0]["suffix"] == "", d
          rest = [x for x in d if x["name"] != "dyng"]
          assert all(x["name"].startswith("dyng-cu") and x["suffix"] for x in rest), d
          print(json.dumps(rest, separators=(",", ":")))' "${distributions}")"
          plugins=false
          if [ "${plugin_distributions}" != "[]" ]; then
            plugins=true
          fi
          {
            echo "kind=${kind}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "plugins=${plugins}"
            echo "distributions=${distributions}"
            echo "plugin_distributions=${plugin_distributions}"
          } >> "${GITHUB_OUTPUT}"
          echo "tag v${tag}: ${kind} ${version} (pre-release: ${prerelease}; CUDA plugins: ${plugins})"
          echo "distributions: ${distributions}"

  reservation:
    name: Build the name-reservation package
    needs: select
    if: needs.select.outputs.kind == 'reservation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir dist tools/name_reservation
      - name: Check metadata
        run: twine check --strict dist/*
      - name: Smoke test the wheel
        env:
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          "${RUNNER_TEMP}/smoke/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/smoke/bin/python" -c "import os, dyng; assert dyng.__version__ == os.environ['VERSION'], dyng.__version__"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reservation-dist
          path: dist/
          if-no-files-found: error

  package:
    name: Build the distributions (wheels.yml)
    needs: select
    if: needs.select.outputs.kind == 'package'
    uses: ./.github/workflows/wheels.yml  # zizmor: ignore[self-repository] the syntax actionlint validates
    with:
      plugins: ${{ needs.select.outputs.plugins == 'true' }}

  collect:
    name: Collect and check the distributions
    needs: [select, reservation, package]
    # One of the two build jobs ran (the other is skipped) and none failed.
    if: ${{ !cancelled() && needs.select.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: The name-reservation package
        if: needs.select.outputs.kind == 'reservation'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: reservation-dist
          path: dist/
      - name: The sdist of wheels.yml
        if: needs.select.outputs.kind == 'package'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist/
      - name: The wheels of wheels.yml (the CPU wheel, and the CUDA plugins from v0.2.0)
        if: needs.select.outputs.kind == 'package'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - name: twine check; the distributions again (versions, tags, size budget, the release set)
        env:
          KIND: ${{ needs.select.outputs.kind }}
          VERSION: ${{ needs.select.outputs.version }}
        run: |
          python -m pip install twine
          ls -l dist/
          twine check --strict dist/*
          if [ "${KIND}" = "package" ]; then
            test -f "dist/dyng-${VERSION}.tar.gz"
            ls dist/dyng-"${VERSION}"-cp312-abi3-*manylinux_2_28_x86_64*.whl
            # Exactly the distributions select named (the plugins from v0.2.0), one directory
            # each for the publish jobs.
            python ci/wheel_check.py dist/* --platform manylinux_2_28_x86_64 --require-libgomp \
              --release-set --split publish
          else
            mkdir -p publish/dyng
            cp dist/* publish/dyng/
          fi
          find publish -type f | sort
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: publish/
          if-no-files-found: error

  publish-testpypi-plugins:
    name: Publish ${{ matrix.name }} to TestPyPI
    needs: [select, collect]
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.select.outputs.plugins == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # From v0.2.0: dyng-cu12 (environment testpypi-cu12) and dyng-cu13 (testpypi-cu13); each
        # project's trusted publisher is bound to its own environment.
        include: ${{ fromJSON(needs.select.outputs.plugin_distributions) }}
    environment:
      name: testpypi${{ matrix.suffix }}
      url: https://test.pypi.org/p/${{ matrix.name }}
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/${{ matrix.name }}/
          skip-existing: true

  publish-testpypi:
    name: Publish dyng to TestPyPI
    # After every plugin reached TestPyPI (or there is none: before v0.2.0, the reservation).
    needs: [select, collect, publish-testpypi-plugins]
    if: ${{ !cancelled() && needs.collect.result == 'success' && (needs.publish-testpypi-plugins.result == 'success' || (needs.publish-testpypi-plugins.result == 'skipped' && needs.select.outputs.plugins == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dyng
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/dyng/
          skip-existing: true

  publish-pypi-plugins:
    name: Publish ${{ matrix.name }} to PyPI
    # Every distribution reached TestPyPI first; final versions only.
    needs: [select, publish-testpypi]
    if: ${{ !cancelled() && needs.publish-testpypi.result == 'success' && needs.select.outputs.prerelease == 'false' && needs.select.outputs.plugins == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # dyng-cu12 (environment pypi-cu12) and dyng-cu13 (pypi-cu13); each environment
        # requires the author's approval.
        include: ${{ fromJSON(needs.select.outputs.plugin_distributions) }}
    environment:
      name: pypi${{ matrix.suffix }}
      url: https://pypi.org/p/${{ matrix.name }}
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/${{ matrix.name }}/

  publish-pypi:
    name: Publish dyng to PyPI
    # Last: after every plugin reached PyPI, so `dyng[cuN]` never names a missing distribution.
    # Environment pypi, with the author's approval (the third of three for v0.2.0).
    needs: [select, publish-testpypi, publish-pypi-plugins]
    if: ${{ !cancelled() && needs.publish-testpypi.result == 'success' && needs.select.outputs.prerelease == 'false' && (needs.publish-pypi-plugins.result == 'success' || (needs.publish-pypi-plugins.result == 'skipped' && needs.select.outputs.plugins == 'false')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/dyng
    permissions:
      id-token: write  # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/dyng/
