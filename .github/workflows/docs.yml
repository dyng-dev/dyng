#
# The documentation site (PLAN Sections 8.8 and 9.2) on GitHub-hosted runners: Doxygen on the
# public headers, the Sphinx site (MyST + pydata-sphinx-theme + Breathe) with warnings as errors,
# and ci/docs_links.py (links to repository files, the site's anchors), all through ci/docs.sh,
# the same command as the local gate. The tools come from environment.yml (the exact versions
# of the local environment and of .readthedocs.yaml), installed with micromamba. The built site
# is uploaded as the artifact `docs-html` (open index.html after downloading it).
#
# Hosting: GitHub Pages (the author's decision of 2026-10-02, the plan's fallback to Read the
# Docs; PLAN Appendix F), https://dyng-dev.github.io/dyng/. On a push to main the `site` job also
# packs the site as the Pages artifact, and the `deploy` job publishes it: the only job with
# `pages: write` and `id-token: write` (deploy-pages proves the run's identity with an OIDC
# token), in the environment `github-pages`, which only main may deploy to. Pull requests build
# and check the site but never deploy. The repository's Pages source must be "GitHub Actions"
# (docs/developer/repository_settings.md, step 13).
#
# The external links (GitHub, PyPI, papers) are checked weekly and on demand only, in a job that
# is not a required check: their availability is not a property of a pull request.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC: the external link check

permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on main (and scheduled runs) always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}  # a login shell activates the micromamba environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Week (the cached environment is re-solved weekly, like a local env update)
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"
      - name: Install the tools of environment.yml
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          micromamba-version: 2.9.0-0
          environment-file: environment.yml
          cache-environment: true
          cache-environment-key: environment-${{ steps.week.outputs.week }}-
          post-cleanup: all
      - name: Tool versions
        run: |
          doxygen --version
          python -m sphinx --version
          python -c "import breathe, myst_parser, pydata_sphinx_theme as t; print('breathe', breathe.__version__, '| myst-parser', myst_parser.__version__, '| pydata-sphinx-theme', t.__version__)"
      - name: Configure (generates version.hpp / config.hpp; nothing is compiled)
        run: cmake --preset cpu-only -DDYNG_BUILD_TESTS=OFF -DDYNG_BUILD_EXAMPLES=OFF -DDYNG_BUILD_TOOLS=OFF
      - name: Doxygen, Sphinx (-W) and the repository-link and anchor check
        run: ci/docs.sh
      - name: Upload the site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-html
          path: build/docs/html
          if-no-files-found: error
          retention-days: 14
      - name: Pack the site for GitHub Pages (pushes to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: build/docs/html
          retention-days: 7

  # Publishes the site of a push to main on https://dyng-dev.github.io/dyng/.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write     # create the Pages deployment
      id-token: write  # the OIDC token deploy-pages authenticates with
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer push waits rather than cancelling one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check the Pages configuration (source "GitHub Actions")
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Week (the cached environment is re-solved weekly, like a local env update)
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"
      - name: Install the tools of environment.yml
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          micromamba-version: 2.9.0-0
          environment-file: environment.yml
          cache-environment: true
          cache-environment-key: environment-${{ steps.week.outputs.week }}-
          post-cleanup: all
      - name: Configure (generates version.hpp / config.hpp; nothing is compiled)
        run: cmake --preset cpu-only -DDYNG_BUILD_TESTS=OFF -DDYNG_BUILD_EXAMPLES=OFF -DDYNG_BUILD_TOOLS=OFF
      - name: Link check including external links
        env:
          DYNG_LINKCHECK_EXTERNAL: "1"
        run: ci/docs.sh
