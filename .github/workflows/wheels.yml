# SPDX-FileCopyrightText: 2026 The dynG Authors
# SPDX-License-Identifier: Apache-2.0
#
# The distributions of `dyng` (PLAN Sections 7.7 and 8.8; ADRs 0025, 0030 and 0032): the sdist
# and the CPU wheel (manylinux_2_28 x86_64, abi3 for CPython >= 3.12, sequential + OpenMP,
# libgomp bundled by auditwheel), built FROM THAT SDIST with cibuildwheel inside the
# manylinux_2_28 image (its configuration is [tool.cibuildwheel] in pyproject.toml: a small
# pytest subset runs in the built wheel under CPython 3.12 and 3.13); and the CUDA plugin wheels
# dyng-cu12 and dyng-cu13 (PLAN 5.4), built from the same sdist with cibuildwheel in the same
# image (ci/cibuildwheel-plugin.toml): the plugin's CUDA toolkit (the latest 12.x / 13.x, every
# RPM pinned by its SHA-256 in ci/cuda_toolkits.toml, downloaded and checked on the runner,
# cached between runs) is installed in `before-all`, which also renders the plugin's source tree
# (ci/plugin_pyproject.py). Every distribution passes `twine check` and ci/wheel_check.py (the
# size budget: a wheel above 90 MB fails, tags, contents; for a plugin also its entry point, its
# dependency on dyng of the same version, its licence files, no libcuda / libcudart, the module's
# export list, and, in the container, its SASS and PTX against the toolkit's release list). The CPU
# wheel alone, and each plugin wheel with the CPU wheel, are installed into fresh environments
# for Python 3.12 and 3.13 and tested with the whole pytest suite; the runners have no GPU, so a
# plugin's test is the selection's fallback (ci/plugin_smoke.py --expect fallback: dyng._core
# with one dyng.BackendWarning, "no CUDA driver", and the plugin's module importing without a
# driver). The GPU tests of the plugins run on the author's machine (ci/plugin_wheels.sh,
# ci/gpu_local.sh).
#
# Nothing is published here: release.yml calls this workflow (workflow_call) for tags v0.1.0 and
# later and publishes the artifacts `sdist` and `wheel-*`; it builds the plugins (input
# `plugins`) for v0.2.0 and later.
name: wheels

on:
  workflow_call:
    inputs:
      plugins:
        description: Build and test the CUDA plugin wheels dyng-cu12 and dyng-cu13 too
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      plugins:
        description: Build and test the CUDA plugin wheels dyng-cu12 and dyng-cu13 too
        type: boolean
        default: true
  # Every change to what the distributions are built from, the library (cpp/) included: the
  # published plugin configuration (the nanobind module in plugin mode, nvcc 12.x / 13.x with
  # gcc-toolset and the static runtime) is built nowhere else, so a library change that breaks it
  # fails in its pull request, not at the release tag. Not a required check (10 to 20 minutes per
  # plugin).
  pull_request:
    paths:
      - pyproject.toml
      - VERSION
      - CMakeLists.txt
      - cmake/**
      - cpp/**
      - python/**
      - LICENSE
      - NOTICE
      - LICENSES/**
      - THIRD_PARTY_LICENSES.txt
      - THIRD_PARTY_LICENSES_CUDA.txt
      - ci/wheel_check.py
      - ci/plugin_pyproject.py
      - ci/plugin_smoke.py
      - ci/cuda_toolkit.py
      - ci/cuda_toolkits.toml
      - ci/cibw_plugin.sh
      - ci/cibw_plugin_repair.sh
      - ci/cibuildwheel-plugin.toml
      - .github/workflows/wheels.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the sdist
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist
      - name: twine check, ci/wheel_check.py
        run: |
          twine check --strict dist/*
          python ci/wheel_check.py dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel:
    name: CPU wheel (manylinux_2_28 x86_64, abi3)
    # Built from the sdist of the job above, so the sdist that release.yml publishes is the
    # source of the published wheel and is built and tested in the same run (as ci/wheels.sh
    # does locally).
    needs: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist/
      - name: The sdist to build from
        id: sdist
        run: |
          ls dist/dyng-*.tar.gz
          echo "path=$(ls dist/dyng-*.tar.gz)" >> "${GITHUB_OUTPUT}"
      - name: cibuildwheel from the sdist (build, auditwheel repair, the pytest subset under 3.12 and 3.13)
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae  # v4.2.1
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: twine check, ci/wheel_check.py (size budget, tags, contents, bundled libgomp)
        run: |
          python -m pip install twine
          twine check --strict wheelhouse/*.whl
          python ci/wheel_check.py wheelhouse/*.whl --platform manylinux_2_28_x86_64 \
            --require-libgomp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheel-cpu-manylinux_2_28_x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  install-test:
    name: Install test (Python ${{ matrix.python }})
    needs: wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wheel-cpu-manylinux_2_28_x86_64
          path: wheelhouse/
      - name: The wheel alone in a fresh venv, then the whole pytest suite
        env:
          OMP_NUM_THREADS: "2"
        run: |
          python -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/python" -m pip install wheelhouse/*.whl "pytest>=8" \
            "hypothesis==6.167.1"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/venv/bin/dyng" --version
          "${RUNNER_TEMP}/venv/bin/dyng" config
          cd "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/venv/bin/python" -m pytest -q -p no:cacheprovider python/tests \
            2>&1 | tee "${RUNNER_TEMP}/pytest.log"  # the default shell sets -o pipefail
          if grep -q "nanobind: leaked" "${RUNNER_TEMP}/pytest.log"; then
            echo "::error::nanobind reported leaked objects"
            exit 1
          fi

  plugin:
    name: CUDA plugin wheel ${{ matrix.plugin }} (manylinux_2_28 x86_64, abi3)
    # From the same sdist as the CPU wheel (ADR 0030): one source archive for every distribution.
    needs: sdist
    if: ${{ github.event_name == 'pull_request' || inputs.plugins }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        plugin: [cu12, cu13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist/
      - name: The core sdist, unpacked (ci/cibw_plugin.sh turns it into the plugin's tree)
        run: |
          ls dist/dyng-*.tar.gz
          mkdir plugin-src
          tar -xzf dist/dyng-*.tar.gz -C plugin-src --strip-components=1
      - name: Cache the CUDA toolkit's RPM files
        # Not for a release: its toolkit is downloaded afresh. Either way every file is checked
        # against the SHA-256 of ci/cuda_toolkits.toml in the next step and in the container.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cuda-rpms
          key: cuda-rpms-${{ matrix.plugin }}-${{ hashFiles('ci/cuda_toolkits.toml') }}
      - name: The CUDA toolkit's RPM files (pinned in ci/cuda_toolkits.toml, verified)
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          python ci/cuda_toolkit.py show
          python ci/cuda_toolkit.py download --plugin "${PLUGIN}" --dest .cuda-rpms
      - name: cibuildwheel (before-all installs the toolkit and renders the tree; auditwheel repair)
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae  # v4.2.1
        env:
          DYNG_PLUGIN: ${{ matrix.plugin }}
        with:
          package-dir: plugin-src
          output-dir: wheelhouse
          config-file: ci/cibuildwheel-plugin.toml
      - name: twine check, ci/wheel_check.py (size budget, tags, contents, entry point, licences)
        run: |
          python -m pip install twine
          ls -l wheelhouse/
          twine check --strict wheelhouse/*.whl
          python ci/wheel_check.py wheelhouse/*.whl --platform manylinux_2_28_x86_64 \
            --require-libgomp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheel-${{ matrix.plugin }}-manylinux_2_28_x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  plugin-install-test:
    name: Plugin ${{ matrix.plugin }} install test, no GPU (Python ${{ matrix.python }})
    needs: [wheel, plugin]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin: [cu12, cu13]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wheel-cpu-manylinux_2_28_x86_64
          path: core/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wheel-${{ matrix.plugin }}-manylinux_2_28_x86_64
          path: plugin/
      - name: The core and the plugin wheel in a fresh venv; the fallback without a driver; pytest
        env:
          PLUGIN: ${{ matrix.plugin }}
          OMP_NUM_THREADS: "2"
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          venv="${RUNNER_TEMP}/venv"
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install numpy "pytest>=8" "hypothesis==6.167.1"
          # dyng==<version> comes from the core wheel of this run, not from an index.
          "${venv}/bin/python" -m pip install --no-index --find-links core/ --find-links plugin/ \
            "dyng-${PLUGIN}==${version}"
          if python -c 'import ctypes; ctypes.CDLL("libcuda.so.1")' 2>/dev/null; then
            echo "::error::this runner has a CUDA driver; the smoke test expects none"
            exit 1
          fi
          cd "${RUNNER_TEMP}"
          "${venv}/bin/python" "${GITHUB_WORKSPACE}/ci/plugin_smoke.py" --plugin "${PLUGIN}" \
            --expect fallback --reason "no CUDA driver" --version "${version}"
          "${venv}/bin/dyng" config
          cd "${GITHUB_WORKSPACE}"
          "${venv}/bin/python" -m pytest -q -p no:cacheprovider python/tests \
            2>&1 | tee "${RUNNER_TEMP}/pytest.log"  # the default shell sets -o pipefail
          if grep -q "nanobind: leaked" "${RUNNER_TEMP}/pytest.log"; then
            echo "::error::nanobind reported leaked objects"
            exit 1
          fi
