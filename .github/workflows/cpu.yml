#
# CPU build and tests on GitHub-hosted runners (PLAN Section 8.8): the cpu-only (Release) and
# dev (Debug) presets with GCC 12/13 and Clang 17/18 (PLAN Section 7.1), OpenMP on and off,
# `ctest -L cpu` (the conformance kit on the host backends included), and the scaffold check. No
# GPU is needed. Mirrors the `build` and `scaffold` steps of ci/check.sh. The `parity` step
# (ci/check.sh --parity) is not run here: the golden corpus lives outside the repository until it
# is published as a release asset.
name: cpu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-and-test:
    name: ${{ matrix.preset }} / ${{ matrix.compiler }} / openmp=${{ matrix.openmp }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [cpu-only, dev]
        compiler: [gcc-12, gcc-13, clang-18]
        openmp: ["ON"]
        include:
          - preset: cpu-only
            compiler: gcc-13
            openmp: "OFF"
          - preset: cpu-only
            compiler: clang-17
            openmp: "ON"
          - preset: dev
            compiler: clang-18
            openmp: "OFF"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install compiler and build tools
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          family="${COMPILER%-*}"
          version="${COMPILER##*-}"
          sudo apt-get update
          if [ "${family}" = gcc ]; then
            sudo apt-get install -y --no-install-recommends "g++-${version}"
            echo "CC=gcc-${version}" >> "${GITHUB_ENV}"
            echo "CXX=g++-${version}" >> "${GITHUB_ENV}"
          else
            # Clang's OpenMP runtime is libomp.
            sudo apt-get install -y --no-install-recommends "clang-${version}" \
              "libomp-${version}-dev"
            echo "CC=clang-${version}" >> "${GITHUB_ENV}"
            echo "CXX=clang++-${version}" >> "${GITHUB_ENV}"
          fi
          python -m pip install "cmake>=3.30,<4.5" ninja
      - name: Cache CPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CPM.cmake', 'cmake/package-lock.cmake') }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DDYNG_ENABLE_OPENMP=${{ matrix.openmp }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -L cpu

  # The scaffold check (PLAN Section 4.8, the `scaffold` step of ci/check.sh):
  # scripts/new_algorithm.py generates a throwaway algorithm of each family in a copy of the tree,
  # which is configured (Debug, warnings as errors, budgets on), built and must pass its
  # conformance kit; the copy is then deleted.
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install "cmake>=3.30,<4.5" ninja
      - name: Cache CPM downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/CPM.cmake', 'cmake/package-lock.cmake') }}
      - name: Generate, build and test a throwaway algorithm of each family
        run: ci/scaffold_check.sh
