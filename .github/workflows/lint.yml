#
# Formatting, licensing and naming checks (PLAN Sections 8.7 and 8.8): pre-commit (clang-format,
# ruff, whitespace, REUSE, codespell, provenance headers, actionlint, zizmor, the .github checks)
# plus the SHA-to-tag check of the action pins (network), the clang-tidy naming rules, the smoke
# tests of the Python parity harness and the name-reservation package. Mirrors the `format`,
# `reuse`, `provenance`, `precommit`, `tidy` and `harness` steps of ci/check.sh (clang-format and
# REUSE run as pre-commit hooks). The Doxygen check runs in docs.yml (job `site`, ci/docs.sh).
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on main always finish (every commit of main
# gets a complete status).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure
      # Every action SHA must be the commit of the tag in its version comment (git ls-remote;
      # the pre-commit hook checks the pin format offline only).
      - name: Action pins match their version tags
        run: |
          python -m pip install pyyaml==6.0.3
          python ci/github_meta_check.py --verify-pins

  # The clang-tidy naming rules of ADR 0004: the `tidy` step of ci/check.sh, with the clang-tidy
  # of environment.yml (micromamba, as in docs.yml). A configure is enough (compile_commands.json
  # and the generated headers); nothing is compiled.
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}  # a login shell activates the micromamba environment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Week (the cached environment is re-solved weekly, like a local env update)
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "${GITHUB_OUTPUT}"
      - name: Install the tools of environment.yml
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          micromamba-version: 2.9.0-0
          environment-file: environment.yml
          cache-environment: true
          cache-environment-key: environment-${{ steps.week.outputs.week }}-
          post-cleanup: all
      - name: clang-tidy version
        run: clang-tidy --version
      - name: Configure (compile_commands.json and the generated headers; nothing is compiled)
        run: cmake --preset cpu-only -DDYNG_BUILD_TESTS=OFF -DDYNG_BUILD_EXAMPLES=OFF -DDYNG_BUILD_TOOLS=OFF
      - name: clang-tidy naming rules (ci/check.sh, step tidy)
        env:
          DYNG_CHECK_ONLY: tidy
          DYNG_CHECK_PRESETS: cpu-only
        run: ci/check.sh

  # The parity harness and CI scripts (Python): they compile, and the smoke tests of
  # parity/tests and the tests of ci/tests pass (no goldens or originals needed). ruff runs in
  # the pre-commit job.
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile the scripts
        run: python -m py_compile parity/*.py ci/*.py
      - name: Smoke tests of the parity harness and tests of the CI scripts
        run: |
          python -m pip install pytest
          python -m pytest -q parity/tests ci/tests

  name-reservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and check the dyng 0.0.1 name-reservation package
        run: |
          python -m pip install build twine pytest
          python -m build --outdir dist tools/name_reservation
          twine check --strict dist/*
          python -m pip install dist/*.whl
          python -m pytest -q tools/name_reservation/tests
