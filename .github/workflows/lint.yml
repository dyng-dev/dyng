#
# Formatting and licensing checks (PLAN Section 8.8): pre-commit (clang-format, whitespace,
# REUSE, codespell) and the Doxygen check of the public headers. Mirrors the `format`, `reuse`,
# `precommit` and `docs` steps of ci/check.sh (clang-format and REUSE run as pre-commit hooks).
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure

  doxygen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # The same Doxygen as the local gate (environment.yml pins doxygen=1.18.0). Ubuntu 24.04's
      # apt Doxygen 1.9.8 reports false "parameters ... are not documented" errors on documented
      # namespace functions, which made this job fail while ci/check.sh passed.
      - name: Install tools (Doxygen 1.18.0, SHA-256 checked)
        env:
          DOXYGEN_URL: https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
        run: |
          curl -fsSLo "${RUNNER_TEMP}/doxygen.tar.gz" "${DOXYGEN_URL}"
          echo "${DOXYGEN_SHA256}  ${RUNNER_TEMP}/doxygen.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/doxygen.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/doxygen-1.18.0/bin" >> "${GITHUB_PATH}"
          python -m pip install "cmake>=3.30,<4.5" ninja
      - name: Doxygen version
        run: doxygen --version
      - name: Configure (generates version.hpp / config.hpp)
        run: cmake --preset cpu-only -DDYNG_BUILD_TESTS=OFF
      - name: Doxygen, warnings as errors
        run: ci/docs.sh

  name-reservation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and check the dyng 0.0.1 name-reservation package
        run: |
          python -m pip install build twine pytest
          python -m build --outdir dist tools/name_reservation
          twine check --strict dist/*
          python -m pip install dist/*.whl
          python -m pytest -q tools/name_reservation/tests
