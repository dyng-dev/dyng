#
# Formatting and licensing checks (PLAN Section 8.8): pre-commit (clang-format, whitespace,
# REUSE, codespell) and the Doxygen check of the public headers.
name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure

  doxygen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen
          python -m pip install "cmake>=3.30" ninja
      - name: Configure (generates version.hpp / config.hpp)
        run: cmake --preset cpu-only -DDYNG_BUILD_TESTS=OFF
      - name: Doxygen, warnings as errors
        run: ci/docs.sh

  name-reservation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and check the dyng 0.0.1 name-reservation package
        run: |
          python -m pip install build twine pytest
          python -m build --outdir dist tools/name_reservation
          twine check --strict dist/*
          python -m pip install dist/*.whl
          python -m pytest -q tools/name_reservation/tests
